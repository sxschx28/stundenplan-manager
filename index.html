/* ---- MESSAGES (Chat-System) — Neue Nachricht per Modal, Rollen-Gruppen, Löschrechte ---- */
let activeThreadKey = null;

function roleDisplay(u){
  if(!u) return '';
  if(u.role==='teacher'){
    const t = u.teacherId ? byId(DB.teachers, u.teacherId) : null;
    if(t && t.title) return t.title; // z. B. Schulleiter
    return 'Lehrer';
  }
  return {schooladmin:'Schuladministrator', student:'Schüler', sysadmin:'Systemadministrator'}[u.role] || u.role;
}

/* Ermittelt, an wen die aktuell angemeldete Person Nachrichten schreiben darf — gruppiert. */
function getMessageableTargets(){
  const targets = [];
  if(SESSION.role==='sysadmin'){
    // Sysadmin kann an alle Benutzer schreiben
    DB.users.forEach(u=>{
      if(u.id===SESSION.id) return;
      const school = u.schoolId ? byId(DB.schools, u.schoolId) : null;
      targets.push({type:'user', id:u.id, label:`${u.firstName} ${u.lastName}`, sub:roleDisplay(u)+(school?' · '+school.name:''), group:u.role});
    });
  } else if(SESSION.role==='schooladmin'){
    const sid = SESSION.schoolId;
    DB.users.filter(u=>u.schoolId===sid && u.role==='teacher').forEach(u=>{
      targets.push({type:'user', id:u.id, label:`${u.firstName} ${u.lastName}`, sub:roleDisplay(u), group:'teacher'});
    });
    DB.users.filter(u=>u.schoolId===sid && u.role==='student').forEach(u=>{
      const stu = byId(DB.students, u.studentId);
      const cls = stu ? byId(DB.classes, stu.classId) : null;
      targets.push({type:'user', id:u.id, label:`${u.firstName} ${u.lastName}`, sub:'Schüler'+(cls?' · '+cls.name:''), group:'student'});
    });
    classesOf(sid).forEach(cls=>{
      targets.push({type:'class', id:cls.id, label:`Klasse ${cls.name}`, sub:'Broadcast an alle Schüler', group:'class'});
    });
  } else if(SESSION.role==='teacher'){
    const sid = SESSION.schoolId;
    schoolAdminsOf(sid).forEach(a=>{
      targets.push({type:'user', id:a.id, label:`${a.firstName} ${a.lastName}`, sub:'Schuladministrator', group:'schooladmin'});
    });
    // andere Lehrer derselben Schule
    DB.users.filter(u=>u.schoolId===sid && u.role==='teacher' && u.id!==SESSION.id).forEach(u=>{
      targets.push({type:'user', id:u.id, label:`${u.firstName} ${u.lastName}`, sub:roleDisplay(u), group:'teacher'});
    });
    const classIds = new Set([
      ...(DB.teachingAssignments||[]).filter(a=>a.schoolId===sid && a.teacherId===SESSION.teacherId).map(a=>a.classId),
      ...DB.lessons.filter(l=>l.schoolId===sid && l.teacherId===SESSION.teacherId).map(l=>l.classId),
    ]);
    classIds.forEach(cid=>{
      const cls = byId(DB.classes, cid); if(!cls) return;
      targets.push({type:'class', id:cid, label:`Klasse ${cls.name}`, sub:'Broadcast an alle Schüler', group:'class'});
      studentsOf(sid).filter(s=>s.classId===cid).forEach(s=>{
        const u = DB.users.find(x=>x.studentId===s.id);
        if(u) targets.push({type:'user', id:u.id, label:`${s.firstName} ${s.lastName}`, sub:`Schüler · ${cls.name}`, group:'student'});
      });
    });
  } else if(SESSION.role==='student'){
    const sid = SESSION.schoolId;
    const stu = byId(DB.students, SESSION.studentId);
    if(stu){
      const teacherIds = new Set([
        ...(DB.teachingAssignments||[]).filter(a=>a.schoolId===sid && a.classId===stu.classId).map(a=>a.teacherId),
        ...DB.lessons.filter(l=>l.schoolId===sid && l.classId===stu.classId).map(l=>l.teacherId),
      ]);
      teacherIds.forEach(tid=>{
        const t = byId(DB.teachers, tid); if(!t) return;
        const u = DB.users.find(x=>x.teacherId===tid);
        if(u) targets.push({type:'user', id:u.id, label:`${t.firstName} ${t.lastName}`, sub:roleDisplay(u), group:'teacher'});
      });
      // Schüler untereinander (Einstellung des Schuladmins)
      const msgMode = ((DB.notifSettings||{})[sid]||{}).studentMsg || 'class';
      if(msgMode==='class'){
        studentsOf(sid).filter(s=>s.classId===stu.classId && s.id!==stu.id).forEach(s=>{
          const u = DB.users.find(x=>x.studentId===s.id);
          if(u) targets.push({type:'user', id:u.id, label:`${s.firstName} ${s.lastName}`, sub:'Mitschüler', group:'student'});
        });
      } else if(msgMode==='all'){
        studentsOf(sid).filter(s=>s.id!==stu.id).forEach(s=>{
          const u = DB.users.find(x=>x.studentId===s.id);
          const cl = byId(DB.classes, s.classId);
          if(u) targets.push({type:'user', id:u.id, label:`${s.firstName} ${s.lastName}`, sub:'Schüler'+(cl?' · '+cl.name:''), group:'student'});
        });
      }
    }
    schoolAdminsOf(sid).forEach(a=> targets.push({type:'user', id:a.id, label:`${a.firstName} ${a.lastName}`, sub:'Schuladministrator', group:'schooladmin'}));
  }
  const seen = new Set();
  return targets.filter(t=>{ const k=t.type+':'+t.id; if(seen.has(k)) return false; seen.add(k); return true; });
}

function messageVisibleToMe(m){
  // Sysadmin sieht alle Nachrichten
  if(SESSION.role==='sysadmin') return true;
  if(m.toType==='user') return m.fromUserId===SESSION.id || m.toId===SESSION.id;
  if(m.toType==='class'){
    if(m.fromUserId===SESSION.id) return true;
    if(SESSION.role==='student'){ const stu = byId(DB.students, SESSION.studentId); return stu && stu.classId===m.toId; }
    if(SESSION.role==='schooladmin' && m.schoolId===SESSION.schoolId) return true;
    if(SESSION.role==='teacher' && m.schoolId===SESSION.schoolId) return true;
    return false;
  }
  return false;
}
function canDeleteMessage(m){
  if(SESSION.role==='student') return false; // Schüler dürfen nichts löschen
  if(SESSION.role==='sysadmin') return true;
  if(SESSION.role==='schooladmin') return m.schoolId===SESSION.schoolId || m.fromUserId===SESSION.id;
  if(SESSION.role==='teacher') return m.fromUserId===SESSION.id; // Lehrer nur eigene
  return false;
}
function threadKeyOf(m){ return m.toType==='class' ? 'c:'+m.toId : 'u:'+(m.fromUserId===SESSION.id? m.toId : m.fromUserId); }
function initials(label){ const parts = label.trim().split(' '); return ((parts[0]?.[0]||'')+(parts[1]?.[0]||'')).toUpperCase(); }

function buildThreads(){
  const map = {};
  // Nur Threads mit tatsächlichen Nachrichten anzeigen (kein Vorab-Listing aller Kontakte)
  DB.messages.filter(messageVisibleToMe).forEach(m=>{
    const key = threadKeyOf(m);
    if(!map[key]){
      if(m.toType==='class'){
        const cls = byId(DB.classes, m.toId);
        map[key] = {key, type:'class', id:m.toId, label: cls?`Klasse ${cls.name}`:'Klasse', sub:'Broadcast', messages:[]};
      } else {
        const counterpartId = m.fromUserId===SESSION.id ? m.toId : m.fromUserId;
        const u = byId(DB.users, counterpartId);
        map[key] = {key, type:'user', id:counterpartId, label: u?`${u.firstName} ${u.lastName}`:'Unbekannt', sub: u?roleDisplay(u):'', messages:[]};
      }
    }
    map[key].messages.push(m);
  });
  const threads = Object.values(map);
  threads.forEach(t=> t.messages.sort((a,b)=>a.ts-b.ts));
  threads.sort((a,b)=>{
    const at = a.messages.length? a.messages[a.messages.length-1].ts : 0;
    const bt = b.messages.length? b.messages[b.messages.length-1].ts : 0;
    return bt-at;
  });
  return threads;
}

RENDERERS.messages = function(){
  const c = document.getElementById('pageContent');
  const threads = buildThreads();
  if(activeThreadKey && !threads.some(t=>t.key===activeThreadKey)) activeThreadKey = null;
  if(!activeThreadKey && threads.length) activeThreadKey = threads[0].key;
  c.innerHTML = `
    <div style="margin-bottom:14px;">
      <button class="btn btn-primary" onclick="openNewMessageModal()">✉️ Neue Nachricht versenden</button>
    </div>
    <div class="msg-layout">
      <div class="msg-list card" id="msgThreadList"></div>
      <div class="msg-thread card" id="msgThreadView"></div>
    </div>
  `;
  renderThreadList(threads);
  renderThreadView(threads);
};

function openNewMessageModal(){
  const targets = getMessageableTargets();
  const groups = {
    schooladmin: {label:'Schuladministratoren', items:[]},
    teacher: {label:'Lehrer / Schulleitung', items:[]},
    student: {label:'Schüler', items:[]},
    class: {label:'Klassen (Broadcast)', items:[]},
    sysadmin: {label:'Systemadministratoren', items:[]},
  };
  targets.forEach(t=>{
    const g = groups[t.group] || groups.teacher;
    g.items.push(t);
  });
  let opts = '<option value="">— Empfänger wählen —</option>';
  Object.values(groups).forEach(g=>{
    if(!g.items.length) return;
    opts += `<optgroup label="${g.label}">`;
    g.items.forEach(t=>{
      opts += `<option value="${t.type}:${t.id}">${esc(t.label)}${t.sub?' — '+esc(t.sub):''}</option>`;
    });
    opts += `</optgroup>`;
  });
  showModal(`
    <div class="modal-head"><h3>Neue Nachricht versenden</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Empfänger</label>
      <select id="nmTo">${opts}</select>
    </div>
    <div class="field"><label>Betreff (optional)</label>
      <input id="nmSubject" placeholder="Betreff der Nachricht">
    </div>
    <div class="field"><label>Nachricht</label>
      <textarea id="nmText" rows="5" placeholder="Nachricht schreiben…" style="resize:vertical;"></textarea>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="sendNewMessage()">Senden</button>
    </div>
  `);
}
function sendNewMessage(){
  const toVal = document.getElementById('nmTo').value;
  const text = document.getElementById('nmText').value.trim();
  const subject = document.getElementById('nmSubject').value.trim();
  if(!toVal){ toast('Bitte einen Empfänger wählen.','error'); return; }
  if(!text){ toast('Bitte eine Nachricht eingeben.','error'); return; }
  const [type, id] = toVal.split(':');
  let sid = SESSION.schoolId || null;
  if(!sid){ if(type==='user'){ const u=byId(DB.users,id); sid = u? u.schoolId||null : null; } }
  const fullText = subject ? `[${subject}]\n${text}` : text;
  DB.messages.push({id:uid('msg'), schoolId: sid, fromUserId:SESSION.id, toType:type, toId:id, text:fullText, subject, ts:Date.now()});
  saveDB();
  activeThreadKey = type==='class' ? 'c:'+id : 'u:'+id;
  toast('Nachricht gesendet.','success');
  closeModal();
  go('messages');
}

function renderThreadList(threads){
  const el = document.getElementById('msgThreadList');
  if(!threads.length){ el.innerHTML = emptyState('💬','Keine Unterhaltungen','Starte eine neue Nachricht über den Button oben.'); return; }
  el.innerHTML = threads.map(t=>{
    const last = t.messages[t.messages.length-1];
    return `<div class="msg-item ${t.key===activeThreadKey?'active':''}" data-key="${t.key}">
      <div class="avatar" style="width:36px;height:36px;font-size:13px;">${t.type==='class'?'🏷️':initials(t.label)}</div>
      <div style="min-width:0;">
        <b>${esc(t.label)}</b>
        <div class="faint" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px;">${last? esc(last.text) : (t.sub||'Neue Unterhaltung')}</div>
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-key]').forEach(d=> d.onclick=()=>{ activeThreadKey = d.getAttribute('data-key'); go('messages'); });
}
function renderThreadView(threads){
  const el = document.getElementById('msgThreadView');
  const thread = threads.find(t=>t.key===activeThreadKey);
  if(!thread){ el.innerHTML = emptyState('💬','Keine Unterhaltung ausgewählt','Wähle links eine Unterhaltung oder starte eine neue Nachricht.'); return; }
  el.innerHTML = `
    <div class="msg-thread-head"><b>${esc(thread.label)}</b>${thread.sub?`<span class="faint"> · ${esc(thread.sub)}</span>`:''}</div>
    <div class="msg-bubbles" id="msgBubbles">
      ${thread.messages.length? thread.messages.map(m=>{
        const mine = m.fromUserId===SESSION.id;
        const sender = byId(DB.users, m.fromUserId);
        const canDel = canDeleteMessage(m);
        return `<div class="msg-bubble ${mine?'mine':''}" style="position:relative;">
          ${!mine && thread.type==='class' ? `<div class="faint" style="margin-bottom:2px;">${sender?esc(sender.firstName+' '+sender.lastName):''}</div>`:''}
          <div>${esc(m.text)}</div>
          <div class="msg-time" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <span>${new Date(m.ts).toLocaleString('de-DE',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})}</span>
            ${canDel?`<button class="icon-btn" style="font-size:11px;padding:0 4px;" title="Nachricht löschen" onclick="deleteMessage('${m.id}')">🗑️</button>`:''}
          </div>
        </div>`;
      }).join('') : `<div class="faint" style="text-align:center; padding:20px;">Noch keine Nachrichten.</div>`}
    </div>
    <div class="msg-compose">
      <input id="msgInput" placeholder="Nachricht schreiben…" onkeydown="if(event.key==='Enter'){ event.preventDefault(); sendThreadMessage('${thread.type}','${thread.id}'); }">
      <button class="btn btn-primary" onclick="sendThreadMessage('${thread.type}','${thread.id}')">Senden</button>
    </div>
  `;
  const bubbles = document.getElementById('msgBubbles');
  bubbles.scrollTop = bubbles.scrollHeight;
}
function sendThreadMessage(type, id){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  let sid = SESSION.schoolId || null;
  if(!sid){ if(type==='user'){ const u=byId(DB.users,id); sid = u? u.schoolId||null : null; } }
  DB.messages.push({id:uid('msg'), schoolId: sid, fromUserId:SESSION.id, toType:type, toId:id, text, ts:Date.now()});
  saveDB(); input.value='';
  go('messages');
}
function deleteMessage(msgId){
  const m = byId(DB.messages, msgId);
  if(!m || !canDeleteMessage(m)){ toast('Keine Berechtigung.','error'); return; }
  confirmDialog('Nachricht löschen?', 'Diese Nachricht wird unwiderruflich entfernt.', ()=>{
    DB.messages = DB.messages.filter(x=>x.id!==msgId);
    saveDB(); toast('Nachricht gelöscht.','success'); go(currentPage==='msgviewer'?'msgviewer':'messages');
  });
}

/* ---- NACHRICHTEN ANSCHAUEN (nur Schuladmin) ---- */
let msgViewerKey = null;
RENDERERS.msgviewer = function(){
  if(SESSION.role!=='schooladmin' && SESSION.role!=='sysadmin'){
    document.getElementById('pageContent').innerHTML = emptyState('🔒','Kein Zugriff','Nur Schuladministratoren können alle Chats einsehen.');
    return;
  }
  const sid = activeSchoolId();
  const c = document.getElementById('pageContent');
  // Alle Threads der Schule aus Nachrichten ableiten
  const map = {};
  (DB.messages||[]).filter(m=>!sid || m.schoolId===sid || m.schoolId==null).forEach(m=>{
    let key, label, sub;
    if(m.toType==='class'){
      key = 'c:'+m.toId;
      const cls = byId(DB.classes, m.toId);
      label = cls?`Klasse ${cls.name}`:'Klasse';
      sub = 'Broadcast';
    } else {
      const a = m.fromUserId, b = m.toId;
      const pair = [a,b].sort().join('|');
      key = 'p:'+pair;
      const ua = byId(DB.users, a), ub = byId(DB.users, b);
      label = `${ua?ua.firstName+' '+ua.lastName:'?'} ↔ ${ub?ub.firstName+' '+ub.lastName:'?'}`;
      sub = `${ua?roleDisplay(ua):''} / ${ub?roleDisplay(ub):''}`;
    }
    if(!map[key]) map[key] = {key, label, sub, messages:[]};
    map[key].messages.push(m);
  });
  const threads = Object.values(map);
  threads.forEach(t=> t.messages.sort((a,b)=>a.ts-b.ts));
  threads.sort((a,b)=>{
    const at = a.messages.length? a.messages[a.messages.length-1].ts : 0;
    const bt = b.messages.length? b.messages[b.messages.length-1].ts : 0;
    return bt-at;
  });
  if(msgViewerKey && !threads.some(t=>t.key===msgViewerKey)) msgViewerKey = null;
  if(!msgViewerKey && threads.length) msgViewerKey = threads[0].key;

  c.innerHTML = `
    <p class="muted" style="margin-bottom:12px;">Hier siehst du alle Nachrichten-Chats der Schule (nur Ansicht / Löschen). Deine eigenen Chats bleiben unter „Nachrichten“.</p>
    <div class="msg-layout">
      <div class="msg-list card" id="mvList"></div>
      <div class="msg-thread card" id="mvView"></div>
    </div>
  `;
  const listEl = document.getElementById('mvList');
  if(!threads.length){ listEl.innerHTML = emptyState('💬','Keine Chats','Es wurden noch keine Nachrichten geschrieben.'); return; }
  listEl.innerHTML = threads.map(t=>{
    const last = t.messages[t.messages.length-1];
    return `<div class="msg-item ${t.key===msgViewerKey?'active':''}" data-key="${t.key}">
      <div class="avatar" style="width:36px;height:36px;font-size:13px;">💬</div>
      <div style="min-width:0;">
        <b style="font-size:13px;">${esc(t.label)}</b>
        <div class="faint" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;">${last?esc(last.text):t.sub}</div>
      </div>
    </div>`;
  }).join('');
  listEl.querySelectorAll('[data-key]').forEach(el=> el.onclick=()=>{ msgViewerKey=el.getAttribute('data-key'); go('msgviewer'); });

  const viewEl = document.getElementById('mvView');
  const thread = threads.find(t=>t.key===msgViewerKey);
  if(!thread){ viewEl.innerHTML = emptyState('💬','Keine Auswahl','Wähle links einen Chat.'); return; }
  viewEl.innerHTML = `
    <div class="msg-thread-head"><b>${esc(thread.label)}</b><span class="faint"> · ${esc(thread.sub||'')}</span></div>
    <div class="msg-bubbles" id="mvBubbles">
      ${thread.messages.map(m=>{
        const sender = byId(DB.users, m.fromUserId);
        return `<div class="msg-bubble" style="max-width:85%;">
          <div class="faint" style="margin-bottom:2px;">${sender?esc(sender.firstName+' '+sender.lastName):'?'}</div>
          <div>${esc(m.text)}</div>
          <div class="msg-time" style="display:flex;justify-content:space-between;gap:8px;">
            <span>${new Date(m.ts).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
            <button class="icon-btn" style="font-size:11px;" onclick="deleteMessage('${m.id}')">🗑️</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
  const bubbles = document.getElementById('mvBubbles');
  if(bubbles) bubbles.scrollTop = bubbles.scrollHeight;
};

/* ---- CALENDAR ---- */
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

function canEditCalendar(){
  return SESSION.role==='schooladmin' || SESSION.role==='teacher' || SESSION.role==='sysadmin';
}
function eventsOf(sid){
  return (DB.events||[]).filter(e=>e.schoolId===sid);
}
function eventVisibleToMe(e){
  if(SESSION.role==='sysadmin' || SESSION.role==='schooladmin') return true;
  if(SESSION.role==='teacher'){
    if(e.target==='all' || e.target==='teachers') return true;
    if(e.target==='class' && e.classId){
      const sid = SESSION.schoolId;
      return (DB.teachingAssignments||[]).some(a=>a.schoolId===sid && a.teacherId===SESSION.teacherId && a.classId===e.classId)
        || DB.lessons.some(l=>l.schoolId===sid && l.teacherId===SESSION.teacherId && l.classId===e.classId);
    }
    return e.createdBy===SESSION.id;
  }
  if(SESSION.role==='student'){
    if(e.target==='all') return true;
    if(e.target==='class'){
      const stu = byId(DB.students, SESSION.studentId);
      return stu && stu.classId===e.classId;
    }
    return false;
  }
  return false;
}

RENDERERS.calendar = function(){
  const c = document.getElementById('pageContent');
  let sid = activeSchoolId();
  if(SESSION.role==='sysadmin' && !sid){
    if(!DB.schools.length){ c.innerHTML = emptyState('🏫','Keine Schulen','Lege zuerst Schulen an.'); return; }
    c.innerHTML = `<div class="tt-toolbar"><label style="margin:0;">Schule wählen:</label>
      <select id="calSysSchool" style="width:auto;">${DB.schools.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
      <button class="btn btn-primary" onclick="sysActiveSchool=document.getElementById('calSysSchool').value; updateBrand(); go('calendar');">Öffnen</button>
    </div>`;
    return;
  }
  if(!sid){ c.innerHTML = emptyState('🏫','Keine Schule','Kein Schulkontext verfügbar.'); return; }

  const monthNames = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const first = new Date(calYear, calMonth, 1);
  const startDay = (first.getDay()+6)%7;
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const today = new Date();
  const events = eventsOf(sid).filter(eventVisibleToMe);

  c.innerHTML = `
    <div class="tt-toolbar">
      ${SESSION.role==='sysadmin' ? `<select style="width:auto;" onchange="sysActiveSchool=this.value; updateBrand(); go('calendar');">
        ${DB.schools.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('')}
      </select>` : ''}
      <button class="btn btn-ghost btn-sm" onclick="calMonth--; if(calMonth<0){calMonth=11;calYear--;} go('calendar');">‹</button>
      <b style="min-width:160px;text-align:center;">${monthNames[calMonth]} ${calYear}</b>
      <button class="btn btn-ghost btn-sm" onclick="calMonth++; if(calMonth>11){calMonth=0;calYear++;} go('calendar');">›</button>
      <button class="btn btn-ghost btn-sm" onclick="calYear=new Date().getFullYear(); calMonth=new Date().getMonth(); go('calendar');">Heute</button>
      ${canEditCalendar()?`<button class="btn btn-primary btn-sm" onclick="openEventModal()">+ Termin</button>`:''}
      ${(SESSION.role==='schooladmin'||SESSION.role==='sysadmin')?`<button class="btn btn-ghost btn-sm" onclick="deleteAllEvents()" style="color:var(--red);">Alle löschen</button>`:''}
    </div>
    <div class="card" style="padding:12px; overflow-x:auto;">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:640px;">
        ${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div style="text-align:center;font-weight:700;font-size:12px;color:var(--text-dim);padding:6px;">${d}</div>`).join('')}
        ${Array.from({length:startDay},()=>`<div></div>`).join('')}
        ${Array.from({length:daysInMonth},(_,i)=>{
          const day = i+1;
          const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          const isToday = today.getFullYear()===calYear && today.getMonth()===calMonth && today.getDate()===day;
          const dayEvents = events.filter(e=>e.date===dateStr);
          return `<div style="min-height:88px;border:1px solid var(--border);border-radius:10px;padding:6px;background:${isToday?'color-mix(in srgb,var(--accent) 10%,var(--surface-solid))':'var(--surface-solid)'};cursor:pointer;" onclick="showDayEvents('${dateStr}')">
            <div style="font-weight:700;font-size:13px;margin-bottom:4px;color:${isToday?'var(--accent)':'inherit'};">${day}</div>
            ${dayEvents.slice(0,3).map(e=>`<div style="font-size:10.5px;padding:2px 5px;margin-bottom:2px;border-radius:5px;background:color-mix(in srgb,var(--green) 20%,transparent);color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${esc(e.title)}">${esc(e.title)}</div>`).join('')}
            ${dayEvents.length>3?`<div class="faint" style="font-size:10px;">+${dayEvents.length-3} weitere</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>
    <div id="calDayDetail" style="margin-top:16px;"></div>
  `;
};

function showDayEvents(dateStr){
  const sid = activeSchoolId();
  const events = eventsOf(sid).filter(eventVisibleToMe).filter(e=>e.date===dateStr).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const el = document.getElementById('calDayDetail');
  const d = new Date(dateStr+'T12:00:00');
  el.innerHTML = `
    <div class="card" style="padding:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h4>${d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h4>
        ${canEditCalendar()?`<button class="btn btn-sm btn-primary" onclick="openEventModal(null,'${dateStr}')">+ Termin</button>`:''}
      </div>
      ${events.length? events.map(e=>{
        const cls = e.classId ? byId(DB.classes, e.classId) : null;
        const creator = byId(DB.users, e.createdBy);
        const canEdit = canEditCalendar() && (SESSION.role==='schooladmin' || SESSION.role==='sysadmin' || e.createdBy===SESSION.id);
        return `<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start;">
          <div style="min-width:50px;font-weight:700;color:var(--accent);">${e.time||'–'}</div>
          <div style="flex:1;">
            <b>${esc(e.title)}</b>
            ${e.description?`<div class="muted" style="font-size:13px;margin-top:2px;">${esc(e.description)}</div>`:''}
            <div class="faint" style="margin-top:4px;">
              ${e.target==='all'?'Alle':e.target==='teachers'?'Nur Lehrer':(cls?'Klasse '+cls.name:'')}
              ${creator?` · von ${esc(creator.firstName+' '+creator.lastName)}`:''}
            </div>
          </div>
          ${canEdit?`<div style="display:flex;gap:4px;">
            <button class="icon-btn" onclick="openEventModal('${e.id}')">✏️</button>
            <button class="icon-btn" onclick="deleteEvent('${e.id}')">🗑️</button>
          </div>`:''}
        </div>`;
      }).join('') : `<div class="faint">Keine Termine an diesem Tag.</div>`}
    </div>
  `;
}

function openEventModal(id, presetDate){
  const e = id ? byId(DB.events, id) : null;
  const sid = activeSchoolId();
  const classes = classesOf(sid);
  showModal(`
    <div class="modal-head"><h3>${e?'Termin bearbeiten':'Neuer Termin'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Titel</label><input id="evTitle" value="${e?esc(e.title):''}" placeholder="z. B. Elternabend, Klassenfahrt"></div>
    <div class="field"><label>Beschreibung (optional)</label><textarea id="evDesc" rows="3" style="resize:vertical;">${e?esc(e.description||''):''}</textarea></div>
    <div class="row">
      <div class="field"><label>Datum</label><input id="evDate" type="date" value="${e?e.date:(presetDate||new Date().toISOString().slice(0,10))}"></div>
      <div class="field"><label>Uhrzeit (optional)</label><input id="evTime" type="time" value="${e?e.time||'':''}"></div>
    </div>
    <div class="field"><label>Sichtbar für</label>
      <select id="evTarget" onchange="document.getElementById('evClassWrap').style.display=this.value==='class'?'':'none';">
        <option value="all" ${!e||e.target==='all'?'selected':''}>Alle (Lehrer + Schüler)</option>
        <option value="teachers" ${e&&e.target==='teachers'?'selected':''}>Nur Lehrer</option>
        <option value="class" ${e&&e.target==='class'?'selected':''}>Bestimmte Klasse</option>
      </select>
    </div>
    <div class="field" id="evClassWrap" style="${e&&e.target==='class'?'':'display:none;'}">
      <label>Klasse</label>
      <select id="evClass">${classes.map(cl=>`<option value="${cl.id}" ${e&&e.classId===cl.id?'selected':''}>${esc(cl.name)}</option>`).join('')}</select>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary" style="flex:1;justify-content:center;" onclick="saveEvent('${e?e.id:''}')">Speichern</button>
      ${e?`<button class="btn btn-danger" onclick="deleteEvent('${e.id}')">Löschen</button>`:''}
    </div>
  `);
}
function saveEvent(id){
  const sid = activeSchoolId();
  const title = document.getElementById('evTitle').value.trim();
  const description = document.getElementById('evDesc').value.trim();
  const date = document.getElementById('evDate').value;
  const time = document.getElementById('evTime').value || '';
  const target = document.getElementById('evTarget').value;
  const classId = target==='class' ? document.getElementById('evClass').value : null;
  if(!title||!date){ toast('Titel und Datum sind Pflicht.','error'); return; }
  if(id){
    const e = byId(DB.events, id);
    Object.assign(e, {title, description, date, time, target, classId});
    logChange(sid, `Kalendertermin „${title}" bearbeitet.`);
    toast('Termin aktualisiert.','success');
  } else {
    DB.events.push({id:uid('ev'), schoolId:sid, title, description, date, time, target, classId, createdBy:SESSION.id, ts:Date.now()});
    logChange(sid, `Kalendertermin „${title}" erstellt.`);
    toast('Termin erstellt.','success');
  }
  saveDB(); closeModal(); go('calendar');
  setTimeout(()=>showDayEvents(date), 50);
}
function deleteEvent(id){
  const e = byId(DB.events, id);
  if(!e) return;
  confirmDialog('Termin löschen?', `„${e.title}" wird unwiderruflich entfernt.`, ()=>{
    DB.events = DB.events.filter(x=>x.id!==id);
    logChange(e.schoolId, `Kalendertermin „${e.title}" gelöscht.`);
    saveDB(); toast('Termin gelöscht.','success'); closeModal(); go('calendar');
  });
}
function deleteAllEvents(){
  const sid = activeSchoolId();
  if(!sid) return;
  confirmDialog('Alle Termine löschen?', 'Alle Kalendertermine dieser Schule werden unwiderruflich entfernt.', ()=>{
    DB.events = DB.events.filter(e=>e.schoolId!==sid);
    logChange(sid, 'Alle Kalendertermine gelöscht.');
    saveDB(); toast('Alle Termine gelöscht.','success'); go('calendar');
  });
}

/* ---- NOTIFICATIONS (Glocke) ---- */
function getNotifTemplate(sid, type){
  const s = (DB.notifSettings && DB.notifSettings[sid]) || {};
  return s[type] || DEFAULT_NOTIF_TEMPLATES[type] || '';
}
function formatNotifText(tpl, l){
  const subj = byId(DB.subjects, l.substSubjectId || l.subjectId);
  const origSubj = byId(DB.subjects, l.subjectId);
  const teacher = byId(DB.teachers, l.substTeacherId || l.teacherId);
  const origTeacher = byId(DB.teachers, l.teacherId);
  const room = byId(DB.rooms, l.substRoomId || l.roomId);
  const cls = byId(DB.classes, l.classId);
  const dateStr = nearestDateForDay(l.day);
  const dateFmt = dateStr ? new Date(dateStr+'T12:00:00').toLocaleDateString('de-DE') : '';
  return tpl
    .replace(/\{period\}/g, l.period)
    .replace(/\{subject\}/g, subj?subj.name:'—')
    .replace(/\{origSubject\}/g, origSubj?origSubj.name:'—')
    .replace(/\{day\}/g, DAYS[l.day]||'')
    .replace(/\{date\}/g, dateFmt)
    .replace(/\{class\}/g, cls?cls.name:'—')
    .replace(/\{room\}/g, room?room.name:'—')
    .replace(/\{teacher\}/g, teacherName(teacher))
    .replace(/\{origTeacher\}/g, teacherName(origTeacher))
    .replace(/\{reason\}/g, l.reason?': '+l.reason:'');
}
function notifyClassStudents(lesson, type){
  const sid = lesson.schoolId;
  const settings = (DB.notifSettings && DB.notifSettings[sid]) || {};
  if(settings.enabled===false) return;
  if(settings['en_'+type]===false) return;
  const tpl = getNotifTemplate(sid, type);
  if(!tpl) return;
  const text = formatNotifText(tpl, lesson);
  const students = studentsOf(sid).filter(s=>s.classId===lesson.classId);
  students.forEach(stu=>{
    const u = DB.users.find(x=>x.studentId===stu.id);
    if(!u) return;
    DB.notifications.push({
      id:uid('n'), schoolId:sid, userId:u.id, type, text,
      lessonId:lesson.id, read:false, ts:Date.now()
    });
  });
  // keep last 500
  if(DB.notifications.length>500) DB.notifications = DB.notifications.slice(-500);
}
function myNotifications(){
  return (DB.notifications||[]).filter(n=>n.userId===SESSION.id).sort((a,b)=>b.ts-a.ts);
}
function unreadNotifCount(){
  return myNotifications().filter(n=>!n.read).length;
}
function updateNotifBadge(){
  const badge = document.getElementById('notifBadge');
  if(!badge) return;
  const n = unreadNotifCount();
  if(n>0){ badge.textContent = n>99?'99+':n; badge.classList.remove('hidden'); badge.style.display='inline-flex'; }
  else { badge.classList.add('hidden'); badge.style.display='none'; }
}
function toggleNotifPanel(){
  const panel = document.getElementById('notifPanel');
  if(!panel) return;
  if(!panel.classList.contains('hidden')){ panel.classList.add('hidden'); return; }
  const list = myNotifications().slice(0,30);
  panel.innerHTML = `
    <div style="padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
      <b style="font-size:13.5px;">Benachrichtigungen</b>
      ${list.some(n=>!n.read)?`<button class="btn btn-sm btn-ghost" onclick="markAllNotifsRead()">Alle gelesen</button>`:''}
    </div>
    ${list.length? list.map(n=>`
      <div style="padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;background:${n.read?'transparent':'color-mix(in srgb,var(--accent) 6%,transparent)'};" onclick="markNotifRead('${n.id}')">
        <div style="font-size:13px;line-height:1.4;">${esc(n.text)}</div>
        <div class="faint" style="margin-top:3px;">${new Date(n.ts).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
      </div>
    `).join('') : `<div class="faint" style="padding:20px;text-align:center;">Keine Benachrichtigungen</div>`}
  `;
  panel.classList.remove('hidden');
}
function markNotifRead(id){
  const n = byId(DB.notifications, id);
  if(n){ n.read=true; saveDB(); updateNotifBadge(); toggleNotifPanel(); toggleNotifPanel(); }
}
function markAllNotifsRead(){
  myNotifications().forEach(n=>n.read=true);
  saveDB(); updateNotifBadge();
  const panel = document.getElementById('notifPanel');
  if(panel) panel.classList.add('hidden');
}

function nearestDateForDay(dayIdx){
  // Find nearest past/today date matching weekday (0=Mo)
  const now = new Date();
  const jsDay = now.getDay(); // 0=So
  const todayIdx = jsDay===0 ? 6 : jsDay-1;
  let diff = dayIdx - todayIdx;
  if(diff>0) diff -= 7; // prefer past/today
  const d = new Date(now);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function saveLessonContent(lessonId, dateStr){

  const existing = (DB.lessonContents||[]).find(c=>c.lessonId===lessonId && c.date===dateStr);

  else {
    DB.lessonContents.push({

  logChange(l.schoolId, `Unterrichtsinhalt eingetragen (${byId(DB.subjects,l.subjectId)?.name||''}, ${byId(DB.classes,l.classId)?.name||''}).`);
  saveDB(); toast('Unterrichtsinhalt gespeichert.','success'); closeModal();
}

function openAttendanceEditor(lessonId, dateStr){
  const l = byId(DB.lessons, lessonId); if(!l) return;
  const students = studentsOf(l.schoolId).filter(s=>s.classId===l.classId).sort((a,b)=>(a.lastName+a.firstName).localeCompare(b.lastName+b.firstName));
  const attMap = {};
  (DB.attendance||[]).filter(a=>a.lessonId===lessonId && a.date===dateStr).forEach(a=>{ attMap[a.studentId]=a; });
  showModal(`

    <p class="muted" style="margin-bottom:12px;">Status pro Schüler festlegen.</p>

        const cur = attMap[s.id]?.status || 'present';
        return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
          <b style="font-size:13px;min-width:140px;">${esc(s.lastName)}, ${esc(s.firstName)}</b>
          <select id="att_${s.id}" style="width:auto;">
            <option value="present" ${cur==='present'?'selected':''}>Anwesend</option>
            <option value="absent" ${cur==='absent'?'selected':''}>Abwesend</option>
            <option value="late" ${cur==='late'?'selected':''}>Verspätet</option>
            <option value="excused" ${cur==='excused'?'selected':''}>Entschuldigt</option>
          </select>
          <input id="attn_${s.id}" placeholder="Notiz" value="${attMap[s.id]?esc(attMap[s.id].note||''):''}" style="width:120px;">
        </div>`;
      }).join('')}
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:14px;" onclick="saveAttendance('${lessonId}','${dateStr}')">Speichern</button>
  `, 'wide');
}
function saveAttendance(lessonId, dateStr){
  const l = byId(DB.lessons, lessonId); if(!l) return;
  const students = studentsOf(l.schoolId).filter(s=>s.classId===l.classId);
  students.forEach(s=>{
    const status = document.getElementById('att_'+s.id)?.value || 'present';
    const note = document.getElementById('attn_'+s.id)?.value.trim() || '';
    let row = (DB.attendance||[]).find(a=>a.lessonId===lessonId && a.date===dateStr && a.studentId===s.id);
    if(status==='present' && !note){
      if(row) DB.attendance = DB.attendance.filter(a=>a.id!==row.id);
    } else if(row){
      row.status=status; row.note=note;
    } else {
      DB.attendance.push({id:uid('att'), schoolId:l.schoolId, classId:l.classId, lessonId, studentId:s.id, date:dateStr, status, note, teacherId:SESSION.teacherId||null, ts:Date.now()});
    }
  });
  saveDB(); toast('Anwesenheit gespeichert.','success'); closeModal(); go('classbook');
}

      <div class="card" style="padding:0;overflow:hidden;">

      </div>
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="background:var(--accent);color:#fff;padding:10px 14px;font-weight:700;">Gesamt</div>
        <div style="padding:8px 14px;max-height:400px;overflow-y:auto;" id="rpList"></div>
      </div>
    </div>
  `;
  const classF = document.getElementById('rpClass');
  const typeF = document.getElementById('rpType');
  // restore filters if any
  if(window._rpClass) classF.value = window._rpClass;
  if(window._rpType) typeF.value = window._rpType;
  classF.onchange = ()=>{ window._rpClass=classF.value; go('reports'); };
  typeF.onchange = ()=>{ window._rpType=typeF.value; go('reports'); };

  let filtered = list;
  if(classF.value) filtered = filtered.filter(r=>r.classId===classF.value);
  if(typeF.value) filtered = filtered.filter(r=>r.type===typeF.value);
  document.getElementById('rpCount').textContent = filtered.length+' Einträge';

  // Stats
  const stats = {};
  REPORT_TYPES.forEach(t=> stats[t.id]={count:0, subjects:{}});
  filtered.forEach(r=>{
    if(!stats[r.type]) stats[r.type]={count:0,subjects:{}};
    stats[r.type].count++;
    const su = byId(DB.subjects, r.subjectId);
    if(su) stats[r.type].subjects[su.name] = (stats[r.type].subjects[su.name]||0)+1;
  });
  document.getElementById('rpStats').innerHTML = `
    <table><thead><tr><th></th><th>Anzahl</th><th>Häufigste Fächer</th></tr></thead><tbody>
      <tr><td><b>Gesamt</b></td><td>${filtered.length}</td><td></td></tr>
      ${REPORT_TYPES.map(t=>{
        const s = stats[t.id]||{count:0,subjects:{}};
        const top = Object.entries(s.subjects).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([n,c])=>`${n} (${c})`).join(', ');
        return `<tr><td>${esc(t.label)}</td><td>${s.count}</td><td class="faint">${top||'—'}</td></tr>`;
      }).join('')}
    </tbody></table>`;

  document.getElementById('rpList').innerHTML = filtered.length ? `
    <table><thead><tr><th>Datum</th><th>Fach</th><th>Schüler</th><th>Eintrag</th><th></th></tr></thead><tbody>
      ${filtered.slice(0,50).map(r=>{
        const su = byId(DB.subjects, r.subjectId);
        const st = byId(DB.students, r.studentId);
        return `<tr>
          <td class="faint">${r.date?new Date(r.date+'T12:00:00').toLocaleDateString('de-DE'):''}</td>
          <td>${su?esc(su.name):'—'}</td>
          <td>${st?esc(st.lastName+', '+st.firstName):'—'}</td>
          <td>${esc(r.typeLabel)}${r.note?': '+esc(r.note):''}</td>
          <td><button class="icon-btn" onclick="deleteReport('${r.id}')">🗑️</button></td>
        </tr>`;
      }).join('')}
    </tbody></table>` : `<div class="faint" style="padding:20px;text-align:center;">Keine Berichte</div>`;
};

function sendPush(){
  const sid = SESSION.schoolId;
  const target = document.getElementById('pushTarget').value;

    targetId: target==='all'?null:target, text, ts:Date.now(),
    readBy:[]
  });
  if(DB.pushes.length>200) DB.pushes = DB.pushes.slice(-200);
  saveDB(); toast('Push-Nachricht gesendet.','success'); go('pushes');
}
function deletePush(id){
  confirmDialog('Push löschen?', 'Diese Push-Nachricht wird entfernt.', ()=>{

}

  const statusF = window._attStatus || '';
  const letter = window._attLetter || '';
  if(classF) list = list.filter(a=>a.classId===classF);
  if(statusF) list = list.filter(a=>a.status===statusF);
  list = list.sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  if(letter) list = list.filter(a=>{ const s=byId(DB.students,a.studentId); return s && (s.lastName||'').toUpperCase().startsWith(letter); });
  const classes = classesOf(sid);
  c.innerHTML = `
    <div class="tt-toolbar">
      <select style="width:auto;" onchange="window._attClass=this.value; go('attendance');">
        <option value="">Alle Klassen</option>
        ${classes.map(cl=>`<option value="${cl.id}" ${classF===cl.id?'selected':''}>${esc(cl.name)}</option>`).join('')}
      </select>
      <select style="width:auto;" onchange="window._attStatus=this.value; go('attendance');">
        <option value="">Alle Status</option>
        <option value="absent" ${statusF==='absent'?'selected':''}>Abwesend</option>
        <option value="late" ${statusF==='late'?'selected':''}>Verspätet</option>
        <option value="excused" ${statusF==='excused'?'selected':''}>Entschuldigt</option>
      </select>
      <span class="muted">${list.length} Einträge</span>
    </div>
    <div class="card" style="padding:6px 4px;"><table><thead><tr><th>Datum</th><th>Schüler</th><th>Klasse</th><th>Status</th><th>Notiz</th></tr></thead><tbody>
      ${list.map(a=>{
        const s=byId(DB.students,a.studentId); const cl=byId(DB.classes,a.classId);
        const lab={absent:'Abwesend',late:'Verspätet',excused:'Entschuldigt'}[a.status]||a.status;
        return `<tr>
          <td>${new Date(a.date+'T12:00:00').toLocaleDateString('de-DE')}</td>
          <td><b>${s?esc(s.lastName+', '+s.firstName):'—'}</b></td>
          <td>${cl?esc(cl.name):'—'}</td>
          <td><span class="pill ${a.status==='late'?'amber':'red'}">${lab}</span></td>
          <td class="faint">${esc(a.note||'')}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="5" class="faint">Keine Abwesenheiten.</td></tr>'}
    </tbody></table></div>
  `;
};

/* ---- STUDENT: Meine Berichte ---- */
RENDERERS.myreports = function(){
  const c = document.getElementById('pageContent');
  const sid = SESSION.schoolId;
  const stu = byId(DB.students, SESSION.studentId);
  if(!stu){ c.innerHTML = emptyState('📋','Keine Daten','Schülerprofil nicht gefunden.'); return; }
  let list = (DB.reports||[]).filter(r=>r.schoolId===sid && r.studentId===stu.id);
  const sort = window._mrSort || 'newest';
  if(sort==='newest') list = list.slice().sort((a,b)=>b.ts-a.ts);
  else if(sort==='oldest') list = list.slice().sort((a,b)=>a.ts-b.ts);
  else if(sort==='type') list = list.slice().sort((a,b)=>(a.typeLabel||'').localeCompare(b.typeLabel||'')||b.ts-a.ts);

  const stats = {};
  REPORT_TYPES.forEach(t=> stats[t.id]=0);
  list.forEach(r=>{ stats[r.type]=(stats[r.type]||0)+1; });

  c.innerHTML = `
    <div class="tt-toolbar">
      <select style="width:auto;" onchange="window._mrSort=this.value; go('myreports');">
        <option value="newest" ${sort==='newest'?'selected':''}>Neueste zuerst</option>
        <option value="oldest" ${sort==='oldest'?'selected':''}>Älteste zuerst</option>
        <option value="type" ${sort==='type'?'selected':''}>Nach Art</option>
      </select>
      <span class="muted">${list.length} Einträge</span>
    </div>
    <div class="grid grid-2">
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="background:var(--accent);color:#fff;padding:10px 14px;font-weight:700;">Übersicht</div>
        <table><tbody>
          ${REPORT_TYPES.map(t=>`<tr><td style="padding:8px 14px;">${esc(t.label)}</td><td style="padding:8px 14px;text-align:right;font-weight:700;">${stats[t.id]||0}</td></tr>`).join('')}
        </tbody></table>
      </div>
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="background:var(--accent);color:#fff;padding:10px 14px;font-weight:700;">Einträge</div>
        <div style="padding:8px 14px;max-height:420px;overflow-y:auto;">
          ${list.length? list.map(r=>{
            const su = byId(DB.subjects, r.subjectId);
            const isPos = REPORT_TYPES.find(t=>t.id===r.type)?.positive;
            return `<div style="padding:10px 0;border-bottom:1px solid var(--border);">
              <div style="display:flex;justify-content:space-between;gap:8px;">
                <span class="pill ${isPos?'green':'amber'}">${esc(r.typeLabel)}</span>
                <span class="faint">${r.date?new Date(r.date+'T12:00:00').toLocaleDateString('de-DE'):''}</span>
              </div>
              ${r.note?`<div style="margin-top:4px;font-size:13.5px;">${esc(r.note)}</div>`:''}
              <div class="faint" style="margin-top:3px;">${su?esc(su.name):''}</div>
            </div>`;
          }).join('') : `<div class="faint" style="padding:20px;text-align:center;">Noch keine Berichte</div>`}
        </div>
      </div>
    </div>
  `;
};

/* ---- TAGESINFOS (Schuladmin → Dashboard aller) ---- */
RENDERERS.dayinfos = function(){
  const c = document.getElementById('pageContent');
  const sid = SESSION.schoolId;
  const list = (DB.dayInfos||[]).filter(d=>d.schoolId===sid).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  c.innerHTML = `
    <div class="card" style="padding:20px;margin-bottom:18px;">
      <h4>ℹ️ Tagesinfo hinzufügen</h4>
      <p class="muted" style="font-size:13px;margin-bottom:12px;">Erscheint auf dem Dashboard von Lehrern und Schülern (z. B. Raumänderungen, Aufsichtsvertretungen).</p>
      <div class="field"><label>Datum</label><input id="diDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Text</label><textarea id="diText" rows="3" style="resize:vertical;" placeholder="z. B. Klasse 9a/9b TIP: Raum 2.12, 2.13 und PC"></textarea></div>
      <div class="field"><label>Sichtbar für</label>
        <select id="diTarget">
          <option value="all">Alle (Lehrer + Schüler)</option>
          <option value="teachers">Nur Lehrer</option>
          <option value="students">Nur Schüler</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="saveDayInfo()">Speichern</button>
    </div>
    <div class="section-title">Vorhandene Tagesinfos</div>
    <div id="diList"></div>
  `;
  const el = document.getElementById('diList');
  if(!list.length){ el.innerHTML = emptyState('ℹ️','Noch keine Tagesinfos','Lege die erste Info für heute an.'); return; }
  el.innerHTML = `<div class="card" style="padding:6px 4px;"><table><thead><tr><th>Datum</th><th>Text</th><th>Für</th><th></th></tr></thead><tbody>
    ${list.map(d=>`<tr>
      <td class="faint">${new Date(d.date+'T12:00:00').toLocaleDateString('de-DE')}</td>
      <td>${esc(d.text)}</td>
      <td class="faint">${d.target==='all'?'Alle':d.target==='teachers'?'Lehrer':'Schüler'}</td>
      <td><button class="icon-btn" onclick="deleteDayInfo('${d.id}')">🗑️</button></td>
    </tr>`).join('')}
  </tbody></table></div>`;
};
function saveDayInfo(){
  const sid = SESSION.schoolId;
  const date = document.getElementById('diDate').value;
  const text = document.getElementById('diText').value.trim();
  const target = document.getElementById('diTarget').value;
  if(!date||!text){ toast('Datum und Text sind Pflicht.','error'); return; }
  DB.dayInfos.push({id:uid('di'), schoolId:sid, date, text, target, createdBy:SESSION.id, ts:Date.now()});
  if(DB.dayInfos.length>300) DB.dayInfos = DB.dayInfos.slice(-300);
  logChange(sid, `Tagesinfo für ${date} erstellt.`);
  saveDB(); toast('Tagesinfo gespeichert.','success'); go('dayinfos');
}
function deleteDayInfo(id){
  confirmDialog('Tagesinfo löschen?', 'Dieser Eintrag wird entfernt.', ()=>{
    DB.dayInfos = DB.dayInfos.filter(x=>x.id!==id); saveDB(); toast('Gelöscht.','success'); go('dayinfos');
  });
}
function dayInfosForMe(dateStr){
  const sid = SESSION.schoolId || activeSchoolId();
  if(!sid) return [];
  return (DB.dayInfos||[]).filter(d=>{
    if(d.schoolId!==sid) return false;
    if(dateStr && d.date!==dateStr) return false;
    if(SESSION.role==='teacher' && d.target==='students') return false;
    if(SESSION.role==='student' && d.target==='teachers') return false;
    return true;
  }).sort((a,b)=>b.ts-a.ts);
}
function upcomingEventsForMe(limit){
  const sid = SESSION.schoolId || activeSchoolId();
  if(!sid) return [];
  const today = new Date().toISOString().slice(0,10);
  return eventsOf(sid).filter(eventVisibleToMe).filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||'')).slice(0, limit||8);
}

/* ---- EXPORT / IMPORT ---- */
RENDERERS.export = function(){
  const c = document.getElementById('pageContent');
  c.innerHTML = `
    <div class="grid grid-2">
      <div class="card" style="padding:22px;">
        <h4>💾 Daten exportieren</h4>
        <p class="muted" style="font-size:13px;">Speichere alle Daten als JSON-Datei — als Backup oder zum Übertragen.</p>
        <button class="btn btn-primary" onclick="exportData()">Jetzt exportieren</button>
      </div>
      <div class="card" style="padding:22px;">
        <h4>📥 Daten importieren</h4>
        <p class="muted" style="font-size:13px;">Lade eine zuvor exportierte JSON-Datei. Bestehende Daten werden ersetzt.</p>
        <input type="file" id="importFile" accept="application/json" style="margin-bottom:12px;">
        <button class="btn btn-ghost" onclick="importData()">Importieren</button>
      </div>
    </div>
  `;
};
function exportData(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `stundenplan-export-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('Export erstellt.','success');
}
function importData(){
  const input = document.getElementById('importFile');
  const file = input.files[0];
  if(!file){ toast('Bitte eine Datei auswählen.','error'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.schools || !data.users){ throw new Error('invalid'); }
      confirmDialog('Import bestätigen', 'Alle aktuellen Daten werden durch die importierte Datei ersetzt.', ()=>{
        DB = data; saveDB(); toast('Daten erfolgreich importiert.','success');
        if(SESSION){ const still = DB.users.find(u=>u.id===SESSION.id); SESSION = still || DB.users[0]; }
        go('dashboard');
      });
    }catch(err){ toast('Ungültige Datei.','error'); }
  };
  reader.readAsText(file);
}

/* ---------------------- modal / confirm ---------------------- */
function showModal(innerHTML, size){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='activeModalOverlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  const modal = document.createElement('div');
  modal.className='modal'+(size==='wide'?' wide':'');
  modal.innerHTML = innerHTML;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}
function closeModal(){ const el = document.getElementById('activeModalOverlay'); if(el) el.remove(); }
function confirmDialog(title, text, onConfirm){
  showModal(`
    <div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p class="muted">${text}</p>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-danger" style="flex:1;justify-content:center;" id="confirmYes">Ja, fortfahren</button>
      <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="closeModal()">Abbrechen</button>
    </div>
  `);
  document.getElementById('confirmYes').onclick = ()=>{ closeModal(); onConfirm(); };
}

/* ---------------------- global search ---------------------- */
function onGlobalSearch(q){
  const box = document.getElementById('searchResults');
  q = q.trim().toLowerCase();
  if(!q){ box.classList.add('hidden'); box.innerHTML=''; return; }
  const sid = SESSION.role==='sysadmin' ? null : (activeSchoolId());
  let results = [];
  const scope = (arr)=> sid ? arr.filter(x=>x.schoolId===sid) : arr;

  scope(DB.teachers).forEach(t=>{ if((t.firstName+' '+t.lastName+' '+t.kuerzel).toLowerCase().includes(q)) results.push({icon:'👩‍🏫', label:`${t.firstName} ${t.lastName} (${t.kuerzel})`, sub:'Lehrer', action:()=>{go('teachers');}}); });
  scope(DB.students).forEach(s=>{ if((s.firstName+' '+s.lastName).toLowerCase().includes(q)) results.push({icon:'🎓', label:`${s.firstName} ${s.lastName}`, sub:'Schüler', action:()=>{go('students');}}); });
  scope(DB.classes).forEach(cl=>{ if(cl.name.toLowerCase().includes(q)) results.push({icon:'🏷️', label:cl.name, sub:'Klasse', action:()=>{ttView='class'; ttFilterId=cl.id; go('timetable');}}); });
  scope(DB.subjects).forEach(s=>{ if(s.name.toLowerCase().includes(q) || (s.kuerzel||'').toLowerCase().includes(q)) results.push({icon:'📘', label:s.name, sub:'Fach', action:()=>{go('subjects');}}); });
  scope(DB.rooms).forEach(r=>{ if(r.name.toLowerCase().includes(q)) results.push({icon:'🚪', label:r.name, sub:'Raum', action:()=>{ttView='room'; ttFilterId=r.id; go('timetable');}}); });
  if(SESSION.role==='sysadmin'){ DB.schools.forEach(s=>{ if(s.name.toLowerCase().includes(q)) results.push({icon:'🏫', label:s.name, sub:'Schule', action:()=>{sysActiveSchool=s.id; updateBrand(); go('schools');}}); }); }

  if(!results.length){ box.innerHTML = `<div class="faint">Keine Ergebnisse für "${esc(q)}"</div>`; box.classList.remove('hidden'); return; }
  box.innerHTML = results.slice(0,10).map((r,i)=>`<div style="display:flex; align-items:center; gap:10px; padding:8px 4px; cursor:pointer; border-radius:10px;" onmouseover="this.style.background='var(--bg2)'" onmouseout="this.style.background='transparent'" data-i="${i}">
    <span>${r.icon}</span><div><b style="font-size:13.5px;">${esc(r.label)}</b><div class="faint">${r.sub}</div></div></div>`).join('');
  box.classList.remove('hidden');
  box.querySelectorAll('[data-i]').forEach((el,i)=> el.onclick = ()=>{ results[i].action(); box.classList.add('hidden'); document.getElementById('globalSearch').value=''; });
}

/* ---------------------- utils ---------------------- */
function esc(str){ return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
