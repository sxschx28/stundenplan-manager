<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stundenplan Manager</title>
<style>
:root{
  --bg:#f2f3f7; --bg2:#e9eaf0; --surface:rgba(255,255,255,.72); --surface-solid:#ffffff;
  --border:rgba(0,0,0,.08); --text:#1c1d21; --text-dim:#6b6d76; --text-faint:#9a9ca6;
  --accent:#0a84ff; --accent2:#5e5ce6; --green:#2fb350; --red:#ef4444; --amber:#f5a623;
  --shttps://github.com/sxschx28/stundenplan-manager/tree/mainhadow:0 8px 30px rgba(20,20,40,.08); --shadow-sm:0 2px 10px rgba(20,20,40,.06);
  --radius:18px; --radius-sm:12px;
  --mono:'SF Mono',Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#0e0f13; --bg2:#15161c; --surface:rgba(30,31,38,.72); --surface-solid:#1b1c22;
  --border:rgba(255,255,255,.08); --text:#eceef2; --text-dim:#a4a6b0; --text-faint:#6c6e78;
  --shadow:0 8px 30px rgba(0,0,0,.35); --shadow-sm:0 2px 12px rgba(0,0,0,.3);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(circle at 20% -10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 45%),
             radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--accent2) 10%, transparent), transparent 40%),
             var(--bg);
  color:var(--text); -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
a{color:inherit;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

/* ---------- utility ---------- */
.hidden{display:none !important;}
.card{
  background:var(--surface); backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm);
}
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:10px 16px; border-radius:12px; border:1px solid transparent;
  font-size:14px; font-weight:600; cursor:pointer; transition:transform .12s ease, background .15s ease, box-shadow .15s ease;
  background:var(--surface-solid); color:var(--text); border:1px solid var(--border);
}
.btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-sm);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none;}
.btn-danger{background:var(--red); color:#fff; border:none;}
.btn-ghost{background:transparent; border:1px solid var(--border);}
.btn-sm{padding:6px 10px; font-size:12.5px; border-radius:9px;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
input,select,textarea{
  font-family:inherit; font-size:14px; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface-solid); color:var(--text); outline:none; width:100%; transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
label{font-size:12.5px; font-weight:600; color:var(--text-dim); display:block; margin-bottom:5px;}
.field{margin-bottom:14px;}
.row{display:flex; gap:12px;}
.row > .field{flex:1;}
.pill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:100px; font-size:11.5px; font-weight:700;
  background:var(--bg2); color:var(--text-dim);
}
.pill.blue{background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent);}
.pill.green{background:color-mix(in srgb, var(--green) 18%, transparent); color:var(--green);}
.pill.red{background:color-mix(in srgb, var(--red) 16%, transparent); color:var(--red);}
.pill.amber{background:color-mix(in srgb, var(--amber) 20%, transparent); color:#b5790a;}
:root[data-theme="dark"] .pill.amber{color:var(--amber);}
h1,h2,h3,h4{margin:0 0 4px 0; font-weight:700; letter-spacing:-0.01em;}
.muted{color:var(--text-dim);}
.faint{color:var(--text-faint); font-size:12.5px;}
.toast-wrap{position:fixed; top:calc(20px + env(safe-area-inset-top,0px)); right:20px; z-index:9999; display:flex; flex-direction:column; gap:10px;}
.toast{
  padding:12px 16px; border-radius:12px; background:var(--surface-solid); border:1px solid var(--border); box-shadow:var(--shadow);
  font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:8px; min-width:220px; animation:slideIn .25s ease;
}
.toast.success{border-left:4px solid var(--green);}
.toast.error{border-left:4px solid var(--red);}
.toast.info{border-left:4px solid var(--accent);}
@keyframes slideIn{from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:translateX(0);}}
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,10,15,.45); backdrop-filter:blur(4px); z-index:2000;
  display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal{
  background:var(--surface-solid); border-radius:20px; border:1px solid var(--border); box-shadow:var(--shadow);
  width:100%; max-width:480px; max-height:88vh; overflow-y:auto; padding:24px; animation:popIn .18s ease;
}
.modal.wide{max-width:640px;}
@keyframes popIn{from{opacity:0; transform:scale(.96) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);}}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
.modal-close{background:var(--bg2); border:none; border-radius:50%; width:30px; height:30px; cursor:pointer; font-size:15px; color:var(--text-dim);}
.empty-state{text-align:center; padding:50px 20px; color:var(--text-dim);}
.empty-state .icon{font-size:38px; margin-bottom:10px;}
table{width:100%; border-collapse:collapse;}
th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); font-size:13.5px;}
th{color:var(--text-dim); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em;}
tr:last-child td{border-bottom:none;}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:15px;padding:4px 6px;border-radius:8px;}
.icon-btn:hover{background:var(--bg2); color:var(--text);}

/* ---------- login ---------- */
#login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.login-card{width:100%; max-width:380px; padding:38px 32px; text-align:center;}
.login-logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 16px; box-shadow:0 10px 24px color-mix(in srgb, var(--accent) 40%, transparent);}
.login-card h1{font-size:22px;}
.role-tabs{display:flex; gap:6px; background:var(--bg2); padding:4px; border-radius:12px; margin:18px 0;}
.role-tab{flex:1; padding:8px 4px; border-radius:9px; text-align:center; font-size:12px; font-weight:700; cursor:pointer; color:var(--text-dim);}
.role-tab.active{background:var(--surface-solid); color:var(--text); box-shadow:var(--shadow-sm);}
.login-hint{font-size:11.5px; color:var(--text-faint); margin-top:14px; line-height:1.5;}
.theme-toggle-login{position:fixed; top:20px; right:20px;}

/* ---------- app shell ---------- */
#app{display:none; min-height:100vh;}
#app.active{display:flex;}
.sidebar{
  width:250px; flex-shrink:0; background:var(--surface); backdrop-filter:blur(20px); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:18px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 20px;}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex;align-items:center;justify-content:center;font-size:16px;}
.brand b{font-size:15px;}
.brand span{font-size:11px; color:var(--text-faint); display:block;}
.nav-section{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:700; margin:16px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px; cursor:pointer; font-size:13.5px; font-weight:600;
  color:var(--text-dim); margin-bottom:2px; transition:background .12s;
}
.nav-item .emoji{font-size:15px; width:18px; text-align:center;}
.nav-item:hover{background:var(--bg2);}
.nav-item.active{background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 90%, transparent), color-mix(in srgb, var(--accent2) 90%, transparent)); color:#fff;}
.sidebar-footer{margin-top:auto; padding-top:14px; border-top:1px solid var(--border);}
.user-chip{display:flex; align-items:center; gap:10px; padding:8px; border-radius:12px; cursor:pointer;}
.user-chip:hover{background:var(--bg2);}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;}
.user-chip b{font-size:13px; display:block;}
.user-chip span{font-size:11px; color:var(--text-faint);}

.main{flex:1; min-width:0; padding:22px 30px 60px; padding-top:calc(22px + env(safe-area-inset-top,0px));}
.topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
.topbar h2{font-size:22px;}
.topbar .actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.search-box{position:relative;}
.search-box input{width:220px; padding-left:32px;}
.search-box .ic{position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--text-faint);}

.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-card{padding:18px 20px;}
.stat-card .n{font-size:26px; font-weight:800; letter-spacing:-0.02em;}
.stat-card .l{font-size:12.5px; color:var(--text-dim); font-weight:600; margin-top:2px;}
.stat-card .em{font-size:20px; float:right; opacity:.7;}

.quick-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
@media(max-width:800px){.quick-grid{grid-template-columns:repeat(2,1fr);}}
.quick-tile{padding:16px; cursor:pointer; text-align:left;}
.quick-tile .em{font-size:20px;}
.quick-tile b{display:block; margin-top:8px; font-size:13.5px;}

/* timetable */
.tt-toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
.tt-wrap{overflow-x:auto;}
.tt-grid{
  display:grid; grid-template-columns:70px repeat(5,minmax(150px,1fr)); gap:8px; min-width:820px;
}
.tt-head-cell{padding:10px 6px; text-align:center; font-weight:700; font-size:12.5px; color:var(--text-dim);}
.tt-head-cell.today{color:var(--accent);}
.tt-period-cell{display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11.5px; color:var(--text-faint); font-weight:700; padding:4px;}
.tt-period-cell span{font-size:10px; font-weight:500;}
.tt-cell{min-height:64px; border-radius:12px; padding:2px;}
.lesson-block{
  border-radius:11px; padding:8px 9px; height:100%; cursor:pointer; position:relative; overflow:hidden;
  border:1px solid var(--border); transition:transform .1s;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
}
.lesson-block:hover{transform:scale(1.02);}
.lesson-block .sub{font-weight:700; font-size:12.5px;}
.lesson-block .meta{font-size:10.5px; opacity:.85; margin-top:2px; line-height:1.4;}
.lesson-block.cancelled .sub{text-decoration:line-through; color:var(--red);}
.lesson-block.cancelled .meta{text-decoration:line-through; color:var(--red); opacity:.9;}
.lesson-block.substitute{padding:5px 6px;}
.lesson-block .half{display:flex; gap:4px; width:100%; align-items:stretch; text-align:center;}
.lesson-block .half > div{flex:1; min-width:0; padding:4px 4px; border-radius:8px;}
.lesson-block .half .canc-side .sub{text-decoration:line-through; color:var(--red); font-size:11.5px;}
.lesson-block .half .canc-side .meta{text-decoration:line-through; color:var(--red); font-size:10px;}
.lesson-block .half .sub-side .sub{color:var(--green); font-size:11.5px;}
.lesson-block .half .sub-side .meta{color:var(--green); font-size:10px;}
.tt-cell{display:flex; flex-direction:column; gap:3px; min-height:64px;}
.tt-cell .lesson-block{flex:1;}
.tt-empty-cell{border:1.5px dashed var(--border); border-radius:12px; height:100%; min-height:56px; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:18px; cursor:pointer; opacity:0; transition:opacity .12s;}
.tt-cell:hover .tt-empty-cell{opacity:1;}
.current-slot{outline:2px solid var(--accent); outline-offset:-2px;}

.data-toolbar{display:flex; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}

.conflict-box{background:color-mix(in srgb, var(--red) 10%, transparent); border:1px solid color-mix(in srgb, var(--red) 35%, transparent); color:var(--red); padding:10px 14px; border-radius:12px; font-size:13px; margin-bottom:14px; font-weight:600;}
.school-card{padding:18px; cursor:pointer; position:relative;}
.school-card.active-school{border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent);}
.school-stats{display:flex; gap:14px; margin-top:10px; flex-wrap:wrap;}
.school-stats div{font-size:12px; color:var(--text-dim);}
.school-stats b{color:var(--text); display:block; font-size:15px;}

.mobile-toggle{display:none;}
@media(max-width:900px){
  .sidebar{position:fixed; z-index:1500; left:-270px; transition:left .22s ease; box-shadow:var(--shadow);}
  .sidebar.open{left:0;}
  .mobile-toggle{display:inline-flex;}
  .main{padding:16px 16px 60px;}
  .sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1400;}
  .sidebar-scrim.open{display:block;}
}
@media print{
  .sidebar,.topbar .actions,.no-print{display:none !important;}
  .main{padding:0;}
  body{background:#fff;}
}
.section-title{font-size:16px; font-weight:700; margin:22px 0 12px;}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text-dim); margin-bottom:14px;}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

/* messages / chat */
.msg-layout{display:grid; grid-template-columns:280px 1fr; gap:16px; height:calc(100vh - 160px); min-height:420px;}
@media(max-width:800px){.msg-layout{grid-template-columns:1fr; height:auto;}}
.msg-list{overflow-y:auto; padding:8px;}
.msg-item{display:flex; align-items:center; gap:10px; padding:10px; border-radius:12px; cursor:pointer;}
.msg-item:hover{background:var(--bg2);}
.msg-item.active{background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, transparent), color-mix(in srgb, var(--accent2) 14%, transparent));}
.msg-item b{font-size:13.5px; display:block;}
.msg-thread{display:flex; flex-direction:column; min-height:360px;}
.msg-thread-head{padding:14px 18px; border-bottom:1px solid var(--border); font-size:14px;}
.msg-bubbles{flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:8px;}
.msg-bubble{max-width:70%; padding:9px 13px; border-radius:16px; background:var(--bg2); font-size:13.5px; align-self:flex-start; line-height:1.4;}
.msg-bubble.mine{align-self:flex-end; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;}
.msg-time{font-size:10px; opacity:.65; margin-top:3px; text-align:right;}
.msg-compose{display:flex; gap:10px; padding:14px 18px; border-top:1px solid var(--border);}
.msg-compose input{flex:1;}
</style>
</head>
<body>

<div class="toast-wrap" id="toastWrap"></div>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <button class="btn btn-ghost theme-toggle-login" onclick="toggleTheme()">🌗 Design</button>
  <div class="login-card card">
    <div class="login-logo">📚</div>
    <h1>Stundenplan Manager</h1>
    <p class="muted" style="font-size:13px;margin-top:4px;">Melde dich an, um fortzufahren</p>
    <div class="field" style="text-align:left;margin-top:22px;">
      <label>Benutzername</label>
      <input id="loginUser" placeholder="z. B. admin" autocomplete="username">
    </div>
    <div class="field" style="text-align:left;">
      <label>Passwort</label>
      <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="loginError" class="hidden" style="background:color-mix(in srgb, var(--red) 12%, transparent); color:var(--red); padding:9px 12px; border-radius:10px; font-size:13px; font-weight:600; margin-bottom:12px; text-align:left;"></div>
    <button class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;" onclick="doLogin()">Anmelden</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="sidebar-scrim" id="scrim" onclick="closeSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">📚</div>
      <div><b>Stundenplan</b><span id="brandSchool">Manager</span></div>
    </div>
    <div id="navItems"></div>
    <div class="sidebar-footer">
      <div class="user-chip" onclick="go('profile')">
        <div class="avatar" id="avatarInitials">?</div>
        <div><b id="chipName">—</b><span id="chipRole">—</span></div>
      </div>
      <button class="btn btn-ghost" style="width:100%; justify-content:center; margin-top:10px;" onclick="logout()">⏻ Abmelden</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn btn-ghost mobile-toggle" onclick="openSidebar()">☰</button>
        <div class="modules-wrap no-print" style="position:relative;">
          <button class="btn btn-primary btn-sm" id="modulesBtn" onclick="toggleModulesMenu()" style="gap:6px;">
            <span>▦</span> Module <span style="opacity:.7;font-size:10px;">▾</span>
          </button>
          <div id="modulesMenu" class="card hidden" style="position:absolute;left:0;top:40px;width:min(520px,92vw);padding:16px;z-index:600;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;"></div>
        </div>
        <h2 id="pageTitle">Dashboard</h2>
      </div>
      <div class="actions">
        <div class="search-box no-print">
          <span class="ic">🔍</span>
          <input id="globalSearch" placeholder="Suche…" oninput="onGlobalSearch(this.value)">
        </div>
        <div class="notif-bell-wrap no-print" id="notifBellWrap" style="position:relative;">
          <button class="btn btn-ghost" onclick="toggleNotifPanel()" title="Benachrichtigungen" style="position:relative;">
            🔔<span id="notifBadge" class="hidden" style="position:absolute;top:2px;right:2px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;"></span>
          </button>
          <div id="notifPanel" class="card hidden" style="position:absolute;right:0;top:42px;width:340px;max-height:400px;overflow-y:auto;z-index:500;padding:0;box-shadow:var(--shadow);"></div>
        </div>
        <button class="btn btn-ghost no-print" onclick="toggleTheme()">🌗</button>
      </div>
    </div>
    <div id="searchResults" class="card hidden" style="padding:14px; margin-bottom:18px;"></div>
    <div id="pageContent"></div>
  </div>
</div>

<script>
/* =========================================================================
   STUNDENPLAN MANAGER — komplette Logik in einer Datei
   Datenmodell wird vollständig in localStorage persistiert.
========================================================================= */

const STORAGE_KEY = 'stundenplan_manager_data_v2';
const DAYS = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];
const DAY_SHORT = ['Mo','Di','Mi','Do','Fr'];
const DEFAULT_PERIODS = [
  {p:1,start:'08:00',end:'08:45'}, {p:2,start:'08:50',end:'09:35'},
  {p:3,start:'09:55',end:'10:40'}, {p:4,start:'10:45',end:'11:30'},
  {p:5,start:'11:45',end:'12:30'}, {p:6,start:'12:35',end:'13:20'},
  {p:7,start:'13:30',end:'14:15'}, {p:8,start:'14:20',end:'15:05'},
];
/* Returns the (school-specific, editable) period/time grid for a given school. */
function getPeriods(sid){
  const s = sid ? byId(DB.schools, sid) : null;
  return (s && Array.isArray(s.periods) && s.periods.length) ? s.periods : DEFAULT_PERIODS;
}

/* ---------------------- persistence ---------------------- */
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }

function saveDB(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }

function loadDB(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ DB = JSON.parse(raw); ensureDbShape(); return; }catch(e){ console.warn('Datenfehler, erstelle Beispieldaten neu.'); } }
  DB = seedData();
  saveDB();
}
/* Fills in collections that might be missing when loading data from an older version. */
function ensureDbShape(){
  ['schools','users','classes','subjects','rooms','teachers','students','lessons','changelog','teachingAssignments','grades','conversations','messages','events','homework','lessonContents','reports','notifications','pushes','dayInfos','attendance'].forEach(k=>{
    if(!Array.isArray(DB[k])) DB[k] = [];
  });
  (DB.teachers||[]).forEach(t=>{ if(t.title===undefined) t.title=''; });
  (DB.classes||[]).forEach(c=>{ if(c.classTeacherId===undefined) c.classTeacherId=null; });
  (DB.schools||[]).forEach(s=>{ if(s.active===undefined) s.active=true; });
  if(!DB.notifSettings) DB.notifSettings = {};
}

/* ---------------------- toast ---------------------- */
function toast(msg, type='info'){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  const icon = type==='success'?'✅':type==='error'?'⚠️':'ℹ️';
  el.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3200);
}

/* ---------------------- theme ---------------------- */
function toggleTheme(){
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  localStorage.setItem('sp_theme', next);
}
(function initTheme(){
  const saved = localStorage.getItem('sp_theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', saved || (prefersDark?'dark':'light'));
})();

/* ---------------------- auth ---------------------- */
function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginError');
  errBox.classList.add('hidden');
  if(!u || !p){ errBox.textContent='Bitte Benutzername und Passwort eingeben.'; errBox.classList.remove('hidden'); return; }
  const user = DB.users.find(x=>x.username.toLowerCase()===u.toLowerCase() && x.password===p);
  if(!user){ errBox.textContent='Benutzername oder Passwort ist falsch.'; errBox.classList.remove('hidden'); return; }
  SESSION = user;
  if(SESSION.role==='sysadmin'){ sysActiveSchool = DB.schools[0]? DB.schools[0].id : null; }
  sessionStorage.setItem('sp_session_user', user.id);
  enterApp();
}
function logout(){
  SESSION = null;
  sessionStorage.removeItem('sp_session_user');
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('loginUser').value=''; document.getElementById('loginPass').value='';
}
function tryRestoreSession(){
  const id = sessionStorage.getItem('sp_session_user');
  if(!id) return false;
  const user = DB.users.find(u=>u.id===id);
  if(!user) return false;
  SESSION = user;
  if(SESSION.role==='sysadmin'){ sysActiveSchool = DB.schools[0]? DB.schools[0].id : null; }
  return true;
}

function enterApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').classList.add('active');
  document.getElementById('avatarInitials').textContent = (SESSION.firstName[0]+SESSION.lastName[0]).toUpperCase();
  document.getElementById('chipName').textContent = `${SESSION.firstName} ${SESSION.lastName}`;
  const roleLabels = {sysadmin:'Systemadministrator', schooladmin:'Schuladministrator', teacher:'Lehrer', student:'Schüler'};
  document.getElementById('chipRole').textContent = roleLabels[SESSION.role];
  buildNav();
  updateNotifBadge();
  go('dashboard');
  // close notif panel on outside click
  document.addEventListener('click', (e)=>{
    const wrap = document.getElementById('notifBellWrap');
    const panel = document.getElementById('notifPanel');
    if(panel && wrap && !wrap.contains(e.target)) panel.classList.add('hidden');
  });
}

function buildNav(){
  const cont = document.getElementById('navItems');
  cont.innerHTML='';
  const sections = NAV[SESSION.role];
  sections.forEach(sec=>{
    const h = document.createElement('div'); h.className='nav-section'; h.textContent=sec.sec; cont.appendChild(h);
    sec.items.forEach(([key,emoji,label])=>{
      const d = document.createElement('div'); d.className='nav-item'; d.id='nav-'+key;
      d.innerHTML = `<span class="emoji">${emoji}</span><span>${label}</span>`;
      d.onclick = ()=>{ go(key); closeSidebar(); };
      cont.appendChild(d);
    });
  });
  updateBrand();
}
function updateBrand(){
  const el = document.getElementById('brandSchool');
  if(SESSION.role==='sysadmin'){
    const s = byId(DB.schools, sysActiveSchool);
    el.textContent = s? s.name : 'Kein Schulkontext';
  } else if(SESSION.schoolId){
    const s = byId(DB.schools, SESSION.schoolId);
    el.textContent = s? s.name : 'Manager';
  } else { el.textContent='Manager'; }
}
function setActiveNav(key){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const el = document.getElementById('nav-'+key);
  if(el) el.classList.add('active');
}
function toggleModulesMenu(){
  const m = document.getElementById('modulesMenu');
  if(!m) return;
  if(!m.classList.contains('hidden')){ m.classList.add('hidden'); return; }
  const sections = NAV[SESSION.role] || [];
  const items = [];
  sections.forEach(sec=> sec.items.forEach(([key,emoji,label])=> items.push({key,emoji,label})));
  m.innerHTML = items.map(it=>`
    <button class="btn btn-ghost" style="justify-content:flex-start;gap:8px;padding:10px 12px;" onclick="go('${it.key}'); document.getElementById('modulesMenu').classList.add('hidden');">
      <span style="font-size:16px;width:22px;text-align:center;">${it.emoji}</span>
      <span style="font-size:13px;">${esc(it.label)}</span>
    </button>
  `).join('');
  m.classList.remove('hidden');
  setTimeout(()=>{
    const close = (e)=>{
      if(!m.contains(e.target) && e.target.id!=='modulesBtn' && !document.getElementById('modulesBtn')?.contains(e.target)){
        m.classList.add('hidden'); document.removeEventListener('click', close);
      }
    };
    document.addEventListener('click', close);
  }, 0);
}

function go(page, opts){
  currentPage = page;
  document.getElementById('searchResults').classList.add('hidden');
  document.getElementById('globalSearch').value='';
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page] || page;
  setActiveNav(page);
  const render = RENDERERS[page];
  if(render) render(opts||{});
  else document.getElementById('pageContent').innerHTML = '<div class="empty-state">Seite nicht gefunden.</div>';
}

          </div>`).join('')}
        </div>
      `:''}
      <div class="grid grid-3">
        <div class="card stat-card"><div class="em">📘</div><div class="n">${mine.length}</div><div class="l">Stunden pro Woche</div></div>
        <div class="card stat-card"><div class="em">🏷️</div><div class="n">${new Set(mine.map(l=>l.classId)).size}</div><div class="l">Klassen</div></div>
        <div class="card stat-card"><div class="em">🚪</div><div class="n">${new Set(mine.map(l=>l.substRoomId||l.roomId)).size}</div><div class="l">Räume</div></div>
      </div>

    `;

    if(!todays.length){ el.innerHTML = emptyState('🗓️','Kein Unterricht','Heute hast du keine Stunden.'); return; }
    const sorted = todays.sort((a,b)=>a.period-b.period);
    el.innerHTML = `<div class="card" style="padding:6px 4px;"><table><thead><tr><th>Std.</th><th>Fach</th><th>Klasse</th><th>Raum</th><th>Status</th><th></th></tr></thead><tbody>
      ${sorted.map(l=>{
        const subj = byId(DB.subjects, l.substSubjectId||l.subjectId);
        const room = byId(DB.rooms, l.substRoomId||l.roomId);
        const cls = byId(DB.classes, l.classId);
        const pt = getPeriods(sid).find(p=>p.p===l.period);
        let status = '<span class="pill green">Regulär</span>';
        if(l.status==='cancelled') status = '<span class="pill red">Entfällt</span>';
        if(l.status==='substitute') status = '<span class="pill amber">Vertretung</span>';
        return `<tr style="cursor:pointer;" onclick="openLessonDetail('${l.id}')">
          <td>${l.period}. ${pt?`<span class="faint">(${pt.start})</span>`:''}</td>
          <td><b>${subj?esc(subj.name):'—'}</b></td>
          <td>${cls?esc(cls.name):'—'}</td>
          <td>${room?esc(room.name):'—'}</td>
          <td>${status}</td>
          <td><button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();openLessonDetail('${l.id}')">📒 Eintragen</button></td>
        </tr>`;
      }).join('')}
    </tbody></table></div>`;
    return;
  }

  if(SESSION.role==='student'){
    const sid = SESSION.schoolId;
    const stu = byId(DB.students, SESSION.studentId);
    const today = new Date().getDay();
    const dayIdx = today>=1 && today<=5 ? today-1 : null;
    const mine = stu ? lessonsOf(sid).filter(l=>l.classId===stu.classId) : [];
    const todays = dayIdx!==null ? mine.filter(l=>l.day===dayIdx) : [];
    const cls = stu? byId(DB.classes, stu.classId) : null;
    const todayStr = new Date().toISOString().slice(0,10);
    const infos = dayInfosForMe(todayStr);
    const upcoming = upcomingEventsForMe(6);
    const dayLabel = new Date().toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
    c.innerHTML = `
      <h3 style="text-align:center;font-size:24px;margin-bottom:22px;">Herzlich willkommen, ${esc(SESSION.firstName)} ${esc(SESSION.lastName)}</h3>
      <div class="grid grid-2" style="margin-bottom:22px;">
        <div class="card" style="padding:0;overflow:hidden;">
          <div style="background:var(--accent);color:#fff;padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:8px;">ℹ️ ${dayLabel}</div>
          <div style="padding:14px 16px;">
            ${infos.length? infos.map(i=>`<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;">${esc(i.text)}</div>`).join('')
              : `<div class="faint">Keine besonderen Hinweise für heute.</div>`}
            ${todays.filter(l=>l.status==='cancelled'||l.status==='substitute').length? `
              <div style="margin-top:10px;">
                ${todays.filter(l=>l.status==='cancelled').map(l=>{
                  const su=byId(DB.subjects,l.subjectId);
                  return `<div style="padding:6px 0;font-size:13px;color:var(--red);">🚫 ${l.period}. Std. ${su?su.name:''} entfällt${l.reason?' ('+esc(l.reason)+')':''}</div>`;
                }).join('')}
                ${todays.filter(l=>l.status==='substitute').map(l=>{
                  const su=byId(DB.subjects,l.substSubjectId||l.subjectId);
                  const t=byId(DB.teachers,l.substTeacherId||l.teacherId);
                  return `<div style="padding:6px 0;font-size:13px;color:var(--green);">🔁 ${l.period}. Std. ${su?su.name:''}${t?' · '+teacherName(t):''}</div>`;
                }).join('')}
              </div>
            `:''}
          </div>
        </div>
        <div class="card" style="padding:0;overflow:hidden;">
          <div style="background:var(--accent);color:#fff;padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:8px;">📅 Kommende Termine</div>
          <div style="padding:14px 16px;max-height:220px;overflow-y:auto;">
            ${upcoming.length? upcoming.map(e=>{
              const d=new Date(e.date+'T12:00:00');
              return `<div style="padding:8px 0;border-bottom:1px solid var(--border);">
                <div style="font-weight:700;font-size:13px;">${d.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}${e.time?' · '+e.time:''}</div>
                <div style="color:var(--accent);font-size:13.5px;margin-top:2px;">${esc(e.title)}</div>
              </div>`;
            }).join('') : `<div class="faint">Keine kommenden Termine.</div>`}
          </div>
          <div style="padding:10px 16px;border-top:1px solid var(--border);text-align:right;">
            <button class="btn btn-primary btn-sm" onclick="go('calendar')">Zum Kalender</button>
          </div>
        </div>
      </div>
      <p class="muted" style="margin-bottom:12px;">Klasse ${cls?cls.name:'—'} · ${dayIdx!==null? 'Heute, '+DAYS[dayIdx] : 'Wochenende'}</p>
      <div class="grid grid-3">
        <div class="card stat-card"><div class="em">📘</div><div class="n">${todays.length}</div><div class="l">Stunden heute</div></div>
        <div class="card stat-card"><div class="em">🚫</div><div class="n">${todays.filter(l=>l.status==='cancelled').length}</div><div class="l">Ausfälle heute</div></div>
        <div class="card stat-card"><div class="em">🔁</div><div class="n">${todays.filter(l=>l.status==='substitute').length}</div><div class="l">Vertretungen heute</div></div>
      </div>
      <div class="section-title">Heutiger Stundenplan</div>
      <div id="studentTodayList"></div>
    `;
    renderLessonList('studentTodayList', todays.sort((a,b)=>a.period-b.period), sid);
    return;
  }
};

function quickTile(emoji,label,page){
  return `<div class="card quick-tile" onclick="go('${page}')"><div class="em">${emoji}</div><b>${label}</b></div>`;
}
function emptyState(icon,title,text){
  return `<div class="empty-state"><div class="icon">${icon}</div><h4>${title}</h4><p class="faint">${text}</p></div>`;
}
function schoolCardInner(s){
  const t = teachersOf(s.id).length, st = studentsOf(s.id).length, cl = classesOf(s.id).length, r = roomsOf(s.id).length, sub = subjectsOf(s.id).length;
  return `<h4>${s.name}</h4><div class="faint">${s.address||'—'}</div>
    <div class="school-stats">
      <div><b>${t}</b>Lehrer</div><div><b>${st}</b>Schüler</div><div><b>${cl}</b>Klassen</div><div><b>${r}</b>Räume</div><div><b>${sub}</b>Fächer</div>
    </div>`;
}

function renderLessonList(elId, lessons, sid, opts){
  opts = opts || {};
  const el = document.getElementById(elId);
  if(!lessons.length){ el.innerHTML = emptyState('🗓️','Nichts geplant','Für diesen Zeitraum liegen keine Stunden vor.'); return; }
  const showDay = opts.showDay !== false;
  el.innerHTML = `<div class="card" style="padding:6px 4px;"><table><thead><tr>
    ${showDay?'<th>Tag</th>':''}<th>Std.</th><th>Fach</th><th>Lehrer</th><th>Raum</th><th>Klasse</th><th>Status</th><th>Details</th>
  </tr></thead><tbody>
    ${lessons.map(l=>lessonRowHTML(l,sid,showDay)).join('')}
  </tbody></table></div>`;
}
function lessonRowHTML(l, sid, showDay){
  const subj = byId(DB.subjects, l.subjectId);
  const teacher = byId(DB.teachers, l.teacherId);
  const room = byId(DB.rooms, l.roomId);
  const cls = byId(DB.classes, l.classId);
  let statusPill = '<span class="pill">Regulär</span>';
  let details = '';
  if(l.status==='cancelled'){
    statusPill = '<span class="pill red">Entfällt</span>';
    details = l.reason ? esc(l.reason) : 'Ausfall';
  } else if(l.status==='substitute'){
    statusPill = '<span class="pill green">Vertretung</span>';
    const nt = byId(DB.teachers, l.substTeacherId);
    details = (nt?'durch '+teacherName(nt):'')+(l.note?' · '+esc(l.note):'');
  }
  const periods = getPeriods(sid);
  const pt = periods.find(p=>p.p===l.period);
  const timeStr = pt ? `${pt.start}–${pt.end}` : '';
  const showSubj = l.status==='substitute' && l.substSubjectId ? byId(DB.subjects, l.substSubjectId) : subj;
  return `<tr>
    ${showDay?`<td><b>${DAYS[l.day]||'?'}</b></td>`:''}
    <td>${l.period}. ${timeStr?`<span class="faint">(${timeStr})</span>`:''}</td>
    <td style="${l.status==='cancelled'?'text-decoration:line-through;color:var(--red);':(l.status==='substitute'?'color:var(--green);':'')}">${showSubj?esc(showSubj.name):'—'}</td>
    <td>${teacherName(teacher)}</td>
    <td>${room?esc(room.name):'—'}</td>
    <td>${cls?esc(cls.name):'—'}</td>
    <td>${statusPill}</td>
    <td class="faint" style="font-size:12px;">${details}</td>
  </tr>`;
}

RENDERERS.schools = function(){
  const c = document.getElementById('pageContent');
  c.innerHTML = `
    <div class="data-toolbar">
      <div class="muted">${DB.schools.length} Schule(n) im System</div>
      <button class="btn btn-primary" onclick="openSchoolModal()">+ Neue Schule</button>
    </div>
    <div class="grid grid-3" id="schoolGrid"></div>
  `;
  const grid = document.getElementById('schoolGrid');
  if(!DB.schools.length){ grid.innerHTML = emptyState('🏫','Keine Schulen','Erstelle deine erste Schule, um loszulegen.'); return; }
  DB.schools.forEach(s=>{
    const card = document.createElement('div');
    card.className = 'card school-card' + (s.id===sysActiveSchool?' active-school':'');
    const inactive = s.active===false;
    card.innerHTML = schoolCardInner(s) + `
      ${inactive?`<div class="pill red" style="margin-top:8px;">Deaktiviert</div>`:''}
      <div style="display:flex; gap:8px; margin-top:14px;flex-wrap:wrap;" class="no-print">
        <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation(); sysActiveSchool='${s.id}'; updateBrand(); go('timetable');">Öffnen</button>
        <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation(); openSchoolModal('${s.id}')">Bearbeiten</button>
        <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation(); toggleSchoolActive('${s.id}')">${inactive?'Aktivieren':'Deaktivieren'}</button>
        <button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); deleteSchool('${s.id}')">Löschen</button>
      </div>`;
    card.onclick = ()=>{ sysActiveSchool = s.id; updateBrand(); go('schools'); };

function openSchoolModal(id){
  const s = id ? byId(DB.schools,id) : null;
  showModal(`
    <div class="modal-head"><h3>${s?'Schule bearbeiten':'Neue Schule'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Name der Schule</label><input id="mSchoolName" value="${s?esc(s.name):''}" placeholder="z. B. Gymnasium Musterstadt"></div>
    <div class="field"><label>Adresse</label><input id="mSchoolAddr" value="${s?esc(s.address||''):''}" placeholder="Straße, PLZ Ort"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="saveSchool('${s?s.id:''}')">Speichern</button>
  `);
}
function saveSchool(id){
  const name = document.getElementById('mSchoolName').value.trim();
  const addr = document.getElementById('mSchoolAddr').value.trim();
  if(!name){ toast('Bitte einen Namen angeben.','error'); return; }
  if(id){ const s = byId(DB.schools,id); s.name=name; s.address=addr; toast('Schule aktualisiert.','success'); }
  else { const ns={id:uid('sch'),name,address:addr,periods:JSON.parse(JSON.stringify(DEFAULT_PERIODS)),gradeWeights:{...DEFAULT_GRADE_WEIGHTS}}; DB.schools.push(ns); sysActiveSchool=ns.id; toast('Schule erstellt.','success'); }
  saveDB(); closeModal(); go('schools');
}
function toggleSchoolActive(id){
  const s = byId(DB.schools, id); if(!s) return;
  s.active = s.active===false ? true : false;
  saveDB(); toast(s.active?'Schule aktiviert.':'Schule deaktiviert.','success'); go('schools');
}
function deleteSchool(id){
  confirmDialog('Schule wirklich löschen?', 'Alle zugehörigen Lehrer, Schüler, Klassen und Stundenpläne werden ebenfalls gelöscht.', ()=>{
    DB.schools = DB.schools.filter(s=>s.id!==id);
    DB.users = DB.users.filter(u=>u.schoolId!==id);
    DB.classes = DB.classes.filter(x=>x.schoolId!==id);
    DB.subjects = DB.subjects.filter(x=>x.schoolId!==id);
    DB.rooms = DB.rooms.filter(x=>x.schoolId!==id);
    DB.teachers = DB.teachers.filter(x=>x.schoolId!==id);
    DB.students = DB.students.filter(x=>x.schoolId!==id);
    DB.lessons = DB.lessons.filter(x=>x.schoolId!==id);
    if(sysActiveSchool===id) sysActiveSchool = DB.schools[0]?DB.schools[0].id:null;
    saveDB(); toast('Schule gelöscht.','success'); updateBrand(); go('schools');
  });
}

function saveSchoolAdmin(id){
  const first=document.getElementById('mAFirst').value.trim(), last=document.getElementById('mALast').value.trim();
  const sid=document.getElementById('mASchool').value, uname=document.getElementById('mAUser').value.trim(), pass=document.getElementById('mAPass').value;

  if(DB.users.some(u=>u.username.toLowerCase()===uname.toLowerCase() && u.id!==id)){ toast('Benutzername bereits vergeben.','error'); return; }
  if(id){ const u=byId(DB.users,id); Object.assign(u,{firstName:first,lastName:last,schoolId:sid,username:uname,password:pass}); toast('Aktualisiert.','success'); }
  else{ DB.users.push({id:uid('u'), role:'schooladmin', firstName:first,lastName:last,schoolId:sid,username:uname,password:pass}); toast('Schuladministrator erstellt.','success'); }

}
function deleteUser(id){

      <label>Eigene Bezeichnung</label><input id="mTTitleCustom" value="${t&&t.title&&!['Schulleiter','Stellv. Schulleiter','Fachbereichsleitung','Oberstufenkoordinator'].includes(t.title)?esc(t.title):''}" placeholder="z. B. Beratungslehrer">
    </div>
    <div class="row"><div class="field"><label>Benutzername</label><input id="mTUser" value="${u?esc(u.username):''}"></div>
    <div class="field"><label>Passwort</label><input id="mTPass" value="${u?esc(u.password):''}" placeholder="Passwort"></div></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="saveTeacher('${t?t.id:''}')">Speichern</button>`);
  const titleSel = document.getElementById('mTTitle');
  titleSel.onchange = ()=>{ document.getElementById('mTTitleCustomWrap').style.display = titleSel.value==='Sonstiges'?'':'none'; };
}
function saveTeacher(id){
  const first=document.getElementById('mTFirst').value.trim(), last=document.getElementById('mTLast').value.trim();
  const kuerzel=document.getElementById('mTKuerzel').value.trim().toUpperCase();
  const uname=document.getElementById('mTUser').value.trim(), pass=document.getElementById('mTPass').value;
  let title = document.getElementById('mTTitle').value;
  if(title==='Sonstiges') title = document.getElementById('mTTitleCustom').value.trim() || '';
  if(!first||!last||!kuerzel||!uname||!pass){ toast('Bitte alle Felder ausfüllen.','error'); return; }
  const sid = activeSchoolId();
  if(DB.users.some(x=>x.username.toLowerCase()===uname.toLowerCase() && !(id && x.teacherId===id))){ toast('Benutzername bereits vergeben.','error'); return; }
  if(id){
    const t = byId(DB.teachers,id); Object.assign(t,{firstName:first,lastName:last,kuerzel,title});
    const u = DB.users.find(x=>x.teacherId===id); if(u){ u.firstName=first; u.lastName=last; u.username=uname; u.password=pass; }
    logChange(sid,`Lehrer "${first} ${last}" bearbeitet.`);
  } else {
    const tid = uid('t');
    DB.teachers.push({id:tid, schoolId:sid, firstName:first,lastName:last,kuerzel,title});
    DB.users.push({id:uid('u'), role:'teacher', schoolId:sid, teacherId:tid, firstName:first,lastName:last, username:uname, password:pass});
    logChange(sid,`Lehrer "${first} ${last}" erstellt.`);
  }
  saveDB(); toast('Gespeichert.','success'); closeModal(); go('teachers');
}
function deleteTeacher(id){
  const sid = activeSchoolId();
  const primary = DB.lessons.filter(l=>l.schoolId===sid && l.teacherId===id).length;
  const subst = DB.lessons.filter(l=>l.schoolId===sid && l.substTeacherId===id).length;
  const assign = (DB.teachingAssignments||[]).filter(a=>a.schoolId===sid && a.teacherId===id).length;
  let warn = 'Der zugehörige Benutzeraccount wird ebenfalls entfernt.';
  if(primary || subst || assign){
    warn += ` Diese Lehrkraft ist aktuell in ${primary} Unterrichtsstunde(n)${subst?`, ${subst} Vertretung(en)`:''}${assign?` und ${assign} Zuordnung(en)`:''} eingetragen — diese werden automatisch bereinigt, damit keine ungültigen Konflikte oder falschen Zuweisungen bestehen bleiben.`;
  }
  confirmDialog('Lehrer löschen?', warn, ()=>{
    // Stunden, in denen diese Lehrkraft die Hauptlehrkraft ist, werden entfernt (sonst würde beim
    // nächsten Öffnen automatisch eine andere Lehrkraft in das leere Feld einspringen).
    DB.lessons = DB.lessons.filter(l=> !(l.schoolId===sid && l.teacherId===id));
    // Ist die Lehrkraft nur als Vertretung eingetragen, wird ausschließlich die Vertretung entfernt.
    DB.lessons.forEach(l=>{
      if(l.substTeacherId===id){
        l.substTeacherId=null;
        if(!l.substRoomId && !l.substSubjectId){ l.status='normal'; l.note=''; }
      }
    });
    DB.teachingAssignments = (DB.teachingAssignments||[]).filter(a=>a.teacherId!==id);
    DB.teachers = DB.teachers.filter(t=>t.id!==id);
    DB.users = DB.users.filter(u=>u.teacherId!==id);
    saveDB(); toast('Lehrer gelöscht, betroffene Einträge bereinigt.','success'); go('teachers');
  });
}

/* ---- SETTINGS: Stundenzeiten + Notengewichtung ---- */
RENDERERS.periods = function(){
  const sid = activeSchoolId();
  const c = document.getElementById('pageContent');
  const periods = getPeriods(sid).map(p=>({...p}));
  const weights = getGradeWeights(sid);
  c.innerHTML = `
    <div class="section-title" style="margin-top:0;">⏱️ Stundenzeiten</div>
    <p class="muted" style="margin-bottom:16px;">Lege fest, wann jede Unterrichtsstunde beginnt und endet. Diese Zeiten werden im Stundenplan als Vorschlag verwendet und können bei jeder einzelnen Stunde weiterhin individuell angepasst werden.</p>
    <div class="card" style="padding:14px;">
      <table>
        <thead><tr><th>Stunde</th><th>Beginn</th><th>Ende</th><th></th></tr></thead>
        <tbody id="periodsBody">
          ${periods.map((p,i)=>`<tr>
            <td>${p.p}.</td>
            <td><input class="pStart" data-i="${i}" value="${p.start}" style="max-width:110px;"></td>
            <td><input class="pEnd" data-i="${i}" value="${p.end}" style="max-width:110px;"></td>
            <td style="text-align:right;">${periods.length>1? `<button class="icon-btn" onclick="removePeriodRow(${i})">🗑️</button>`:''}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="btn btn-ghost" onclick="addPeriodRow()">+ Stunde hinzufügen</button>
      <button class="btn btn-primary" onclick="savePeriods()">Zeiten speichern</button>
    </div>

    <div class="section-title">📝 Notengewichtung</div>
    <p class="muted" style="margin-bottom:16px;">Bestimmt, wie stark Klassenarbeiten gegenüber sonstigen Leistungen (Tests, mündliche Mitarbeit etc.) in die Endnote einfließen. Üblich und empfohlen: Klassenarbeiten stärker gewichtet, z. B. 70&nbsp;% / 30&nbsp;%.</p>
    <div class="card" style="padding:18px; max-width:420px;">
      <div class="row">
        <div class="field"><label>Klassenarbeiten (%)</label><input id="wKlassenarbeit" type="number" min="0" max="100" value="${weights.klassenarbeit}"></div>
        <div class="field"><label>Sonstige Leistungen (%)</label><input id="wSonstige" type="number" min="0" max="100" value="${weights.sonstige}"></div>
      </div>
      <p class="faint" id="weightSumHint"></p>
      <button class="btn btn-primary" onclick="saveGradeWeights()">Gewichtung speichern</button>
    </div>
  `;
  window.__editingPeriods = periods;
};
function addPeriodRow(){
  const periods = window.__editingPeriods;
  const last = periods[periods.length-1];
  const nextP = last? last.p+1 : 1;
  periods.push({p:nextP, start: last?last.end:'08:00', end: last?last.end:'08:45'});
  RENDERERS.periods();
}
function removePeriodRow(i){
  const periods = window.__editingPeriods;
  periods.splice(i,1);
  periods.forEach((p,idx)=> p.p = idx+1);
  RENDERERS.periods();
}
function savePeriods(){
  const sid = activeSchoolId();
  const periods = window.__editingPeriods.map((p,i)=>{
    const start = document.querySelectorAll('.pStart')[i].value.trim();
    const end = document.querySelectorAll('.pEnd')[i].value.trim();
    return {p:i+1, start, end};
  });
  const timeRe = /^([01]\d|2[0-3]):[0-5]\d$/;
  for(const p of periods){
    if(!timeRe.test(p.start) || !timeRe.test(p.end)){ toast('Bitte Uhrzeiten im Format HH:MM eingeben.','error'); return; }
  }
  const s = byId(DB.schools, sid);
  s.periods = periods;
  logChange(sid, 'Stundenzeiten aktualisiert.');
  saveDB(); toast('Stundenzeiten gespeichert.','success'); go('periods');
};

const DEFAULT_GRADE_WEIGHTS = {klassenarbeit:70, sonstige:30};
function getGradeWeights(sid){
  const s = sid ? byId(DB.schools, sid) : null;
  return (s && s.gradeWeights) ? s.gradeWeights : DEFAULT_GRADE_WEIGHTS;
}
function saveGradeWeights(){
  const sid = activeSchoolId();
  const ka = Number(document.getElementById('wKlassenarbeit').value);
  const so = Number(document.getElementById('wSonstige').value);
  if(!(ka>=0) || !(so>=0) || (ka+so)===0){ toast('Bitte gültige, positive Prozentwerte angeben.','error'); return; }
  const s = byId(DB.schools, sid);
  s.gradeWeights = {klassenarbeit:ka, sonstige:so};
  logChange(sid, `Notengewichtung geändert: Klassenarbeiten ${ka}% / Sonstige ${so}%.`);
  saveDB(); toast('Gewichtung gespeichert.','success'); go('periods');
}

/* Entfernt Stunden, die ein gelöschtes Element als Pflichtfeld referenzieren (sonst würde die
   Auswahl beim nächsten Bearbeiten unbemerkt auf ein anderes Element springen), und bereinigt
   das Element aus Vertretungs-Feldern. */
function cascadeCleanLessons(field, substField, id, sid){
  DB.lessons = DB.lessons.filter(l=> !(l.schoolId===sid && l[field]===id));
  if(substField){
    DB.lessons.forEach(l=>{
      if(l[substField]===id){
        l[substField]=null;
        if(!l.substTeacherId && !l.substRoomId && !l.substSubjectId){ l.status='normal'; l.note=''; }
      }
    });
  }
}

  });
}

/* ---- GRADES (Notensystem) — Spaltenansicht wie in Fachnoten-Software ---- */
function computeGradeAverage(sid, studentId, subjectId){
  const grades = DB.grades.filter(g=>g.schoolId===sid && g.studentId===studentId && g.subjectId===subjectId);
  const ka = grades.filter(g=>g.category==='klassenarbeit').map(g=>g.value);
  const so = grades.filter(g=>g.category==='sonstige').map(g=>g.value);
  const avg = arr=> arr.length? arr.reduce((s,v)=>s+v,0)/arr.length : null;
  const kaAvg = avg(ka), soAvg = avg(so);
  if(kaAvg===null && soAvg===null) return null;
  const w = getGradeWeights(sid);
  if(kaAvg===null) return soAvg;
  if(soAvg===null) return kaAvg;
  return (kaAvg*w.klassenarbeit + soAvg*w.sonstige) / (w.klassenarbeit + w.sonstige);
}
function canEditGrades(){
  return SESSION.role==='teacher' || SESSION.role==='schooladmin' || SESSION.role==='sysadmin';
}
/* Collect unique assessment columns (by category+title+date) for a class/subject so grades align in a grid. */
function gradeColumns(sid, classId, subjectId){
  const studentIds = new Set(studentsOf(sid).filter(s=>s.classId===classId).map(s=>s.id));
  const grades = DB.grades.filter(g=>g.schoolId===sid && g.subjectId===subjectId && studentIds.has(g.studentId));
  const map = {};
  grades.forEach(g=>{
    const key = g.category + '|' + (g.title||'') + '|' + (g.date||'');
    if(!map[key]) map[key] = {key, category:g.category, title:g.title||'', date:g.date||'', count:0};
    map[key].count++;
  });
  const cols = Object.values(map);
  cols.sort((a,b)=>{
    if(a.category!==b.category) return a.category==='klassenarbeit'?-1:1;
    return (a.date||'').localeCompare(b.date||'') || (a.title||'').localeCompare(b.title||'');
  });
  return cols;
}
function gradeForCell(sid, studentId, subjectId, col){
  return DB.grades.find(g=>g.schoolId===sid && g.studentId===studentId && g.subjectId===subjectId
    && g.category===col.category && (g.title||'')===col.title && (g.date||'')===col.date) || null;
}

  if(!students.length){ el.innerHTML = emptyState('🎓','Keine Schüler','Diese Klasse hat noch keine Schüler.'); return; }

  const cols = gradeColumns(sid, classId, subjectId);
  const kaCols = cols.filter(c=>c.category==='klassenarbeit');
  const soCols = cols.filter(c=>c.category==='sonstige');

  let head = `<th style="min-width:140px;">Nr</th><th style="min-width:120px;">Name</th><th style="min-width:100px;">Vorname</th>`;

    head += `<th style="text-align:center;">Ø KA</th>`;

    head += `<th colspan="${soCols.length}" style="text-align:center;background:color-mix(in srgb,var(--green) 12%,transparent);">sonstige Leistungen</th>`;
    head += `<th style="text-align:center;">Ø SL</th>`;
  }
  head += `<th style="text-align:center;font-weight:800;">Ø</th>`;
  if(editable) head += `<th></th>`;

  let subHead = `<th></th><th></th><th></th>`;
  kaCols.forEach((col,i)=>{
    const label = col.title || String(i+1);
    subHead += `<th style="text-align:center;font-size:11px;" title="${esc(col.date||'')}">${esc(label)}</th>`;
  });
  if(kaCols.length) subHead += `<th></th>`;
  soCols.forEach((col,i)=>{
    const label = col.title || String(i+1);
    subHead += `<th style="text-align:center;font-size:11px;" title="${esc(col.date||'')}">${esc(label)}</th>`;
  });
  if(soCols.length) subHead += `<th></th>`;
  subHead += `<th></th>`;
  if(editable) subHead += `<th></th>`;

  const rows = students.map((st, idx)=>{
    const kaGrades = DB.grades.filter(g=>g.schoolId===sid && g.studentId===st.id && g.subjectId===subjectId && g.category==='klassenarbeit');
    const soGrades = DB.grades.filter(g=>g.schoolId===sid && g.studentId===st.id && g.subjectId===subjectId && g.category==='sonstige');
    const avgKa = kaGrades.length ? kaGrades.reduce((s,g)=>s+g.value,0)/kaGrades.length : null;
    const avgSo = soGrades.length ? soGrades.reduce((s,g)=>s+g.value,0)/soGrades.length : null;
    const total = computeGradeAverage(sid, st.id, subjectId);

    let cells = `<td class="faint">${idx+1}</td><td><b>${esc(st.lastName)}</b></td><td>${esc(st.firstName)}</td>`;
    kaCols.forEach(col=>{
      const g = gradeForCell(sid, st.id, subjectId, col);
      if(g){
        cells += `<td style="text-align:center;cursor:${editable?'pointer':'default'};" ${editable?`onclick="openGradeModal('${st.id}','${subjectId}','${g.id}')"`:''}>

      } else {
        cells += `<td style="text-align:center;">${editable?`<button class="grade-empty" onclick="openGradeModal('${st.id}','${subjectId}',null,'klassenarbeit','${esc(col.title)}','${col.date||''}')">+</button>`:'—'}</td>`;
      }
    });
    if(kaCols.length) cells += `<td style="text-align:center;font-weight:600;">${avgKa!==null?avgKa.toFixed(2):'—'}</td>`;
    soCols.forEach(col=>{
      const g = gradeForCell(sid, st.id, subjectId, col);
      if(g){
        cells += `<td style="text-align:center;cursor:${editable?'pointer':'default'};" ${editable?`onclick="openGradeModal('${st.id}','${subjectId}','${g.id}')"`:''}>
          <span class="grade-cell green">${Number(g.value).toFixed(1)}</span></td>`;
      } else {
        cells += `<td style="text-align:center;">${editable?`<button class="grade-empty" onclick="openGradeModal('${st.id}','${subjectId}',null,'sonstige','${esc(col.title)}','${col.date||''}')">+</button>`:'—'}</td>`;
      }

    if(soCols.length) cells += `<td style="text-align:center;font-weight:600;">${avgSo!==null?avgSo.toFixed(2):'—'}</td>`;
    cells += `<td style="text-align:center;"><span class="pill blue">${total!==null?total.toFixed(2):'—'}</span></td>`;
    if(editable) cells += `<td style="text-align:right;"><button class="btn btn-sm btn-ghost" onclick="openGradeModal('${st.id}','${subjectId}')">+ Note</button></td>`;
    return `<tr>${cells}</tr>`;
  }).join('');

  el.innerHTML = `
    <style>
      .grade-cell{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:32px;border-radius:8px;font-weight:700;font-size:13px;padding:0 6px;}
      .grade-cell.amber{background:color-mix(in srgb,var(--amber) 18%,transparent);color:#b5790a;}
      .grade-cell.green{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green);}
      :root[data-theme="dark"] .grade-cell.amber{color:var(--amber);}
      .grade-empty{background:var(--bg2);border:1.5px dashed var(--border);border-radius:8px;width:32px;height:28px;cursor:pointer;color:var(--text-faint);font-size:14px;}
      .grade-empty:hover{border-color:var(--accent);color:var(--accent);}
      #gTeacherTable table th,#gTeacherTable table td{padding:8px 6px;white-space:nowrap;}
    </style>
    <div class="card" style="padding:6px 4px; overflow-x:auto;">
      <table><thead>
        <tr>${head}</tr>
        <tr style="background:var(--bg2);">${subHead}</tr>
      </thead><tbody>${rows}</tbody></table>
    </div>
    ${!cols.length?`<p class="muted" style="margin-top:12px;">Noch keine Noten. Nutze „+ Note hinzufügen“ oder die +-Felder in der Tabelle.</p>`:''}
  `;
}

function saveGrade(subjectId, gradeId){
  const sid = activeSchoolId();
  const studentId = document.getElementById('gStudent').value;
  const category = document.getElementById('gCategory').value;
  const title = document.getElementById('gTitle').value.trim();
  const value = Number(document.getElementById('gValue').value);
  const date = document.getElementById('gDate').value || new Date().toISOString().slice(0,10);
  if(!(value>=1 && value<=6)){ toast('Bitte eine Note zwischen 1,0 und 6,0 angeben.','error'); return; }
  if(!studentId){ toast('Bitte einen Schüler wählen.','error'); return; }

  if(gradeId){
    const g = byId(DB.grades, gradeId);
    if(!g){ toast('Note nicht gefunden.','error'); return; }
    g.category=category; g.title=title; g.value=value; g.date=date;
    logChange(sid, `Note bearbeitet für ${byId(DB.students,studentId)?.firstName||''} ${byId(DB.students,studentId)?.lastName||''}.`);
    toast('Note aktualisiert.','success');
  } else {
    const teacherId = SESSION.teacherId || null;
    DB.grades.push({id:uid('gr'), schoolId:sid, studentId, subjectId, teacherId, category, title, value, date, ts:Date.now()});
    logChange(sid, `Note eingetragen für ${byId(DB.students,studentId)?.firstName||''} ${byId(DB.students,studentId)?.lastName||''}.`);
    toast('Note gespeichert.','success');
  }
  saveDB(); closeModal(); renderGradeGrid();
}
function deleteGrade(gradeId){
  const g = byId(DB.grades, gradeId);
  if(!g) return;
  confirmDialog('Note löschen?', 'Diese Note wird unwiderruflich entfernt.', ()=>{
    DB.grades = DB.grades.filter(x=>x.id!==gradeId);
    logChange(g.schoolId, `Note gelöscht (${byId(DB.students,g.studentId)?.firstName||''} ${byId(DB.students,g.studentId)?.lastName||''}).`);
    saveDB(); toast('Note gelöscht.','success'); closeModal(); renderGradeGrid();
  });
}

function deleteEntity(coll, id, label){
  const sid = activeSchoolId();
  let warn = 'Bestehende Stundenplaneinträge, die dieses Element referenzieren, werden automatisch bereinigt, damit keine ungültigen Zuordnungen oder Konflikte bestehen bleiben.';
  let cascade = ()=>{};
  if(coll==='rooms'){
    const n = DB.lessons.filter(l=>l.schoolId===sid && (l.roomId===id||l.substRoomId===id)).length;
    if(n) warn += ` Betroffen: ${n} Unterrichtsstunde(n).`;
    cascade = ()=> cascadeCleanLessons('roomId','substRoomId', id, sid);
  } else if(coll==='subjects'){
    const n = DB.lessons.filter(l=>l.schoolId===sid && (l.subjectId===id||l.substSubjectId===id)).length;
    if(n) warn += ` Betroffen: ${n} Unterrichtsstunde(n).`;
    cascade = ()=>{
      cascadeCleanLessons('subjectId','substSubjectId', id, sid);
      DB.teachingAssignments = (DB.teachingAssignments||[]).filter(a=>a.subjectId!==id);
    };
  } else if(coll==='classes'){
    const n = DB.lessons.filter(l=>l.schoolId===sid && l.classId===id).length;
    const st = DB.students.filter(s=>s.schoolId===sid && s.classId===id).length;
    if(n||st) warn += ` Betroffen: ${n} Unterrichtsstunde(n)${st?` und ${st} Schüler (verlieren die Klassenzuordnung)`:''}.`;
    cascade = ()=>{
      cascadeCleanLessons('classId', null, id, sid);
      DB.students.forEach(s=>{ if(s.classId===id) s.classId=null; });
      DB.teachingAssignments = (DB.teachingAssignments||[]).filter(a=>a.classId!==id);
    };
  }
  confirmDialog(`${label} löschen?`, warn, ()=>{
    cascade();
    DB[coll] = DB[coll].filter(x=>x.id!==id); saveDB(); toast('Gelöscht.','success'); go(currentPage);
  });
}

function weekRangeLabel(offset){
  const mon = mondayOfOffset(offset);
  const fri = new Date(mon); fri.setDate(mon.getDate()+4);
  const fmt = d=>d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  const kw = getISOWeek(mon);
  return `KW ${kw} · ${fmt(mon)} – ${fmt(fri)}` + (offset===0?' (aktuell)':'');
}
function mondayOfOffset(offset){
  const now = new Date();
  const day = now.getDay(); // 0 So
  const diff = day===0 ? -6 : 1-day;
  const mon = new Date(now);
  mon.setHours(0,0,0,0);
  mon.setDate(now.getDate()+diff + offset*7);
  return mon;
}
function getISOWeek(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date - yearStart) / 86400000) + 1)/7);
}

function renderGrid(container, lessons, sid, view){
  const today = new Date();
  const todayIdx = (today.getDay()>=1 && today.getDay()<=5) ? today.getDay()-1 : -1;
  let html = `<div></div>`;
  DAYS.forEach((d,i)=>{
    html += `<div class="tt-head-cell ${i===todayIdx?'today':''}">${d}${i===todayIdx?' · heute':''}</div>`;
  });
  getPeriods(sid).forEach(pt=>{
    html += `<div class="tt-period-cell">${pt.p}.<span>${pt.start}</span></div>`;
    for(let day=0; day<5; day++){
      const matches = lessons.filter(l=>l.day===day && l.period===pt.p);
      const isCurrent = isNowInPeriod(day, pt);
      html += `<div class="tt-cell ${isCurrent?'current-slot':''}">`;
      if(matches.length){
        html += matches.map(l=>lessonBlockHTML(l, view, sid)).join('');
      } else {
        const canAdd = (SESSION.role==='schooladmin' || SESSION.role==='sysadmin') && view!=='week' && SESSION.role!=='sysadmin';
        html += canAdd ? `<div class="tt-empty-cell" onclick="openLessonModal(null,{day:${day},period:${pt.p}})">+</div>` : `<div class="tt-empty-cell" style="opacity:.15;">·</div>`;
      }
      html += `</div>`;
    }
  });
  container.innerHTML = html;
}
function isNowInPeriod(day, pt){
  const now = new Date();
  const jsDay = now.getDay();
  const idx = jsDay>=1 && jsDay<=5 ? jsDay-1 : -1;
  if(idx!==day) return false;
  const cur = now.getHours()*60+now.getMinutes();
  const [sh,sm] = pt.start.split(':').map(Number), [eh,em] = pt.end.split(':').map(Number);
  return cur >= sh*60+sm && cur <= eh*60+em;
}
function lessonBlockHTML(l, view, sid){
  const origSubj = byId(DB.subjects, l.subjectId);
  const origTeacher = byId(DB.teachers, l.teacherId);
  const origRoom = byId(DB.rooms, l.roomId);
  const cls = byId(DB.classes, l.classId);
  const isCanc = l.status==='cancelled';
  const isSub = l.status==='substitute';
  const color = origSubj ? origSubj.color : '#888';
  const isMyLesson = SESSION.role==='teacher' && (l.teacherId===SESSION.teacherId || l.substTeacherId===SESSION.teacherId);
  const clickable = SESSION.role==='schooladmin' || isMyLesson;
  const clickFn = isMyLesson ? `openLessonDetail('${l.id}')` : (SESSION.role==='schooladmin' ? `openLessonModal('${l.id}')` : '');

  // Vertretung: links grün (neu), rechts rot durchgestrichen (alt) – in derselben Zelle
  if(isSub){
    const newSubj = byId(DB.subjects, l.substSubjectId || l.subjectId);
    const newTeacher = byId(DB.teachers, l.substTeacherId || l.teacherId);
    const newRoom = byId(DB.rooms, l.substRoomId || l.roomId);
    const oldLabel = origSubj ? (origSubj.kuerzel||origSubj.name) : '—';
    const newLabel = newSubj ? (newSubj.kuerzel||newSubj.name) : '—';
    const oldMeta = `${origRoom?esc(origRoom.name):'—'} ${origTeacher?esc(origTeacher.kuerzel||origTeacher.lastName):''}`;
    const newMeta = `${newRoom?esc(newRoom.name):'—'} ${newTeacher?esc(newTeacher.kuerzel||newTeacher.lastName):''}`;
    return `<div class="lesson-block substitute" style="border-left:3px solid var(--green); background:color-mix(in srgb, ${color} 8%, var(--surface-solid));" ${clickable?`onclick="${clickFn}"`:''}>
      <div class="half">
        <div class="sub-side">
          <div class="sub">${esc(newLabel)}</div>
          <div class="meta">${newMeta}${view==='teacher'||view==='week'?` · ${cls?esc(cls.name):''}`:''}</div>
        </div>
        <div class="canc-side">
          <div class="sub">${esc(oldLabel)}</div>
          <div class="meta">${oldMeta}</div>
        </div>
      </div>
    </div>`;
  }

  // Ausfall: Farbe des Fachs behalten, Text rot durchgestrichen
  if(isCanc){
    return `<div class="lesson-block cancelled" style="background:color-mix(in srgb, ${color} 10%, var(--surface-solid)); border-left:3px solid ${color};" ${clickable?`onclick="${clickFn}"`:''}>
      <div class="sub">${origSubj?esc(origSubj.kuerzel||origSubj.name):'—'}</div>
      <div class="meta">${view==='teacher'||view==='week'?esc(cls?cls.name:'')+' · ':''}${origRoom?esc(origRoom.name):'—'} ${origTeacher?esc(origTeacher.kuerzel||origTeacher.lastName):''}</div>
    </div>`;
  }

  // Normal
  return `<div class="lesson-block" style="background:color-mix(in srgb, ${color} 14%, var(--surface-solid)); border-left:3px solid ${color};" ${clickable?`onclick="${clickFn}"`:''}>
    <div class="sub">${origSubj?esc(origSubj.kuerzel||origSubj.name):'—'}</div>
    <div class="meta" style="font-size:10.5px;margin-top:2px;">
      ${view==='teacher'||view==='week'?`<span>${cls?esc(cls.name):'—'}</span> `:''}
      <span>${origRoom?esc(origRoom.name):'—'}</span>
      <span> ${origTeacher?esc(origTeacher.kuerzel||origTeacher.lastName):'—'}</span>
    </div>
  </div>`;
}

function checkConflictLive(){
  const sid = activeSchoolId();
  const day = +document.getElementById('lDay').value, period = +document.getElementById('lPeriod').value;
  const classId = document.getElementById('lClass').value, teacherId = document.getElementById('lTeacher').value, roomId = document.getElementById('lRoom').value;
  const conflicts = findConflicts(sid, {day, period, classId, teacherId, roomId}, editingLessonId);
  const box = document.getElementById('lessonConflict');
  if(conflicts.length){
    box.innerHTML = `<div class="conflict-box">⚠️ Konflikt erkannt<br>${conflicts.join('<br>')}</div>`;
  } else box.innerHTML = '';
}
function findConflicts(sid, {day, period, classId, teacherId, roomId}, excludeId){
  const msgs = [];
  // Ausfälle zählen nicht; zusätzliche + ausgefallene parallel sind ok
  const clashing = lessonsOf(sid).filter(l=>
    l.id!==excludeId && l.status!=='cancelled' && l.day===day && l.period===period
  );
  if(teacherId){
    const teacherClash = clashing.find(l=> l.teacherId===teacherId);
    if(teacherClash){
      const t = byId(DB.teachers, teacherId), cls = byId(DB.classes, teacherClash.classId);
      msgs.push(`Lehrer ${teacherName(t)} ist am ${DAYS[day]} in der ${period}. Stunde bereits der Klasse ${cls?cls.name:'?'} zugewiesen.`);
    }
  }
  if(roomId){
    const roomClash = clashing.find(l=> l.roomId===roomId);
    if(roomClash){
      const r = byId(DB.rooms, roomId);
      msgs.push(`Raum ${r?r.name:'?'} ist am ${DAYS[day]} in der ${period}. Stunde bereits belegt.`);
    }
  }
  if(classId){
    // Nur Konflikt, wenn bereits eine aktive (nicht-ausgefallene) reguläre/zusätzliche Stunde der Klasse existiert
    const classClash = clashing.find(l=> l.classId===classId && !l.isExtra);
    const extraClash = clashing.find(l=> l.classId===classId && l.isExtra);
    // Zusätzliche Stunde neben Ausfall ist gewollt – Konflikt nur bei zwei aktiven
    if(classClash && extraClash){
      // both already exist - still warn
      const cls = byId(DB.classes, classId);
      msgs.push(`Klasse ${cls?cls.name:'?'} hat am ${DAYS[day]} in der ${period}. Stunde bereits Unterricht.`);
    } else if(classClash){
      const cls = byId(DB.classes, classId);
      msgs.push(`Klasse ${cls?cls.name:'?'} hat am ${DAYS[day]} in der ${period}. Stunde bereits eine Unterrichtsstunde. (Bei Vertretung: zuerst als Ausfall markieren, dann zusätzliche Stunde anlegen.)`);
    }
  }
  return msgs;
}
function saveLesson(){
  const sid = activeSchoolId();
  const day = +document.getElementById('lDay').value, period = +document.getElementById('lPeriod').value;
  const classId = document.getElementById('lClass').value, subjectId = document.getElementById('lSubject').value;
  const teacherId = document.getElementById('lTeacher').value, roomId = document.getElementById('lRoom').value;
  const start = document.getElementById('lStart').value.trim(), end = document.getElementById('lEnd').value.trim();
  const conflicts = findConflicts(sid, {day, period, classId, teacherId, roomId}, editingLessonId);
  if(conflicts.length){
    if(!confirm('Es liegen Konflikte vor:\n\n'+conflicts.join('\n')+'\n\nTrotzdem speichern?')) return;
  }
  const isExtra = document.getElementById('lIsExtra')?.checked || false;
  if(editingLessonId){
    const l = byId(DB.lessons, editingLessonId);
    Object.assign(l, {day, period, classId, subjectId, teacherId, roomId, start, end});
    logChange(sid, `Stunde am ${DAYS[day]}, ${period}. Std. bearbeitet.`);
    toast('Stunde aktualisiert.','success');
  } else {
    const lesson = {id:uid('les'), schoolId:sid, day, period, classId, subjectId, teacherId, roomId, start, end, status:'normal', reason:'', note:'', isExtra:!!isExtra, substTeacherId:null, substRoomId:null, substSubjectId:null};
    DB.lessons.push(lesson);
    logChange(sid, isExtra?`Zusätzliche Stunde am ${DAYS[day]}, ${period}. Std.`:`Neue Stunde am ${DAYS[day]}, ${period}. Std. erstellt.`);
    if(isExtra) notifyClassStudents(lesson, 'extra');
    toast(isExtra?'Zusätzliche Stunde hinzugefügt.':'Stunde hinzugefügt.','success');
  }
  saveDB(); closeModal(); go('timetable');
}

function openSubstituteModal(lessonId){

  const teachers = teachersOf(sid), rooms = roomsOf(sid), subjects = subjectsOf(sid);
  // Smart suggestions: free teachers in this period
  const busyTeacherIds = new Set(lessonsOf(sid).filter(x=>x.day===l.day && x.period===l.period && x.status!=='cancelled' && x.id!==l.id).map(x=>x.substTeacherId||x.teacherId));
  const freeTeachers = teachers.filter(t=>!busyTeacherIds.has(t.id));
  const opts = (arr, sel, labelFn, withEmpty)=> (withEmpty?`<option value="">— unverändert —</option>`:'') + arr.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${labelFn(x)}</option>`).join('');
  showModal(`
    <div class="modal-head"><h3>Vertretung eintragen</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p class="muted">Ursprünglich: <b>${byId(DB.subjects,l.subjectId)?.name}</b> · ${teacherName(byId(DB.teachers,l.teacherId))} · ${byId(DB.rooms,l.roomId)?.name}</p>
    ${freeTeachers.length?`<div class="card" style="padding:10px 12px;margin-bottom:12px;background:color-mix(in srgb,var(--green) 8%,transparent);border-color:color-mix(in srgb,var(--green) 30%,transparent);">
      <div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:6px;">💡 Verfügbare Lehrer in dieser Stunde</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        ${freeTeachers.slice(0,8).map(t=>`<button class="btn btn-sm btn-ghost" onclick="document.getElementById('subTeacher').value='${t.id}'">${esc(t.firstName)} ${esc(t.lastName)}</button>`).join('')}
      </div>
    </div>`:`<p class="faint" style="margin-bottom:10px;">Keine freien Lehrer in dieser Stunde gefunden.</p>`}
    <div class="field"><label>Vertretungslehrer</label><select id="subTeacher">${opts(teachers, l.substTeacherId, t=>`${t.firstName} ${t.lastName} (${t.kuerzel})${busyTeacherIds.has(t.id)?' ⚠ belegt':''}`, true)}</select></div>
    <div class="field"><label>Neuer Raum (optional)</label><select id="subRoom">${opts(rooms, l.substRoomId, r=>r.name, true)}</select></div>
    <div class="field"><label>Neues Fach (optional)</label><select id="subSubject">${opts(subjects, l.substSubjectId, s=>s.name, true)}</select></div>
    <div class="field"><label>Hinweis (optional)</label><input id="subNote" value="${esc(l.note||'')}" placeholder="z. B. Vertretung wegen Fortbildung"></div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-primary" style="flex:1;justify-content:center;" onclick="saveSubstitute('${l.id}')">Vertretung speichern</button>
      ${l.status==='substitute' ? `<button class="btn btn-ghost" onclick="clearSubstitute('${l.id}')">Vertretung aufheben</button>` : ''}
    </div>
  `);
}
function saveSubstitute(id){
  const l = byId(DB.lessons, id);
  const st = document.getElementById('subTeacher').value, sr = document.getElementById('subRoom').value, ss = document.getElementById('subSubject').value;
  if(!st && !sr && !ss){ toast('Bitte mindestens Lehrer, Raum oder Fach ändern.','error'); return; }
  l.status='substitute'; l.substTeacherId = st||null; l.substRoomId = sr||null; l.substSubjectId = ss||null;
  l.note = document.getElementById('subNote').value.trim();
  logChange(l.schoolId, `Vertretung eingetragen für ${DAYS[l.day]}, ${l.period}. Std.`);
  notifyClassStudents(l, 'substitute');
  saveDB(); toast('Vertretung gespeichert.','success'); closeModal(); go('timetable');
}
function clearSubstitute(id){
  const l = byId(DB.lessons, id);
  l.status='normal'; l.substTeacherId=null; l.substRoomId=null; l.substSubjectId=null; l.note='';
  logChange(l.schoolId, `Vertretung aufgehoben für ${DAYS[l.day]}, ${l.period}. Std.`);
  notifyClassStudents(l, 'unsubst');
  saveDB(); toast('Vertretung aufgehoben.','success'); closeModal(); go('timetable');
}
